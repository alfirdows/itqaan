<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%230f5c4d%27/%3E%3Ctext x=%2732%27 y=%2746%27 text-anchor=%27middle%27 font-family=%27serif%27 font-size=%2738%27 fill=%27%23f6e7c1%27%3E%D8%A5%3C/text%3E%3C/svg%3E">
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itqaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ec; --surface:#fffdf8; --ink:#1d2a26; --muted:#5f6d68; --line:#e4ddcc;
  --brand:#0f5c4d; --brand-2:#14806b; --gold:#b8892b; --gold-soft:#f3e7c8;
  --ok:#1f8a4c; --ok-soft:#e1f3e8; --bad:#b83a3a; --bad-soft:#f8e3e1;
  --c-noon:#1d6fb8; --c-meem:#8a4fbf; --c-gq:#c0612b; --c-lam:#2f8f5b; --c-madd:#b8336a;
  --radius:16px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1513;--surface:#17201d;--ink:#e9efe9;--muted:#9aa9a3;--line:#26332e;
  --brand:#3fbf9f;--brand-2:#56d3b3;--gold:#d9ad4f;--gold-soft:#2b2618;--ok:#4cc27e;--ok-soft:#173022;--bad:#e57373;--bad-soft:#3a1d1d;
  --c-noon:#5aa6ea;--c-meem:#b48ae0;--c-gq:#e8915c;--c-lam:#5cc58c;--c-madd:#e46c9c;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-family:"Amiri Quran",serif;font-size:20px;line-height:1}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:-2px}
nav{display:flex;gap:4px;margin-inline-start:auto}
nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
nav a:hover{background:var(--line);color:var(--ink)}
nav a.active{background:var(--brand);color:#fff}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.lang:hover{border-color:var(--brand)}
main{padding:28px 0 80px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
h2{font-size:22px;margin:0 0 8px}
h3{font-size:17px;margin:0 0 6px}
p.lead{font-size:18px;color:var(--muted);max-width:640px;margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;margin-bottom:28px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-verse{padding:28px;text-align:center;background:linear-gradient(160deg,var(--brand),#0b3f35);color:#fff;border:none}
.hero-verse .q{font-family:"Amiri Quran",serif;font-size:30px;line-height:2.1;direction:rtl}
.hero-verse .t{opacity:.85;font-size:14px;margin-top:6px}
.tile{display:block;text-decoration:none;color:inherit;padding:20px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-size:20px;margin-bottom:12px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 0}
.stat{flex:1;min-width:140px;padding:16px 18px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.cat-head{display:flex;align-items:center;gap:10px;margin:32px 0 12px}
.cat-head .dot{width:12px;height:12px}
.rule{padding:20px;border-inline-start:4px solid var(--c)}
.rule .tr{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.rule p{margin:0 0 10px;font-size:15px}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;direction:rtl}
.letters span{font-family:"Amiri Quran",serif;font-size:22px;min-width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);padding:0 6px}
.ex{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.ayah{font-family:"Amiri Quran",serif;direction:rtl;text-align:right;font-size:26px;line-height:2.2}
.ayah mark{background:color-mix(in srgb,var(--c,var(--gold)) 22%,transparent);color:inherit;border-radius:6px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--c,var(--gold))}
.ref{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ref a{text-decoration:none}
.note{font-size:14px;color:var(--muted)}
.btn{border:none;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;font-weight:600}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.qbox{padding:26px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.qtext{font-weight:600;margin:14px 0 12px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt small{color:var(--muted);font-size:12px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.picked{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.score{font-size:56px;font-weight:700;color:var(--brand);line-height:1}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
.result-item{padding:14px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.lrow{display:flex;align-items:center;gap:16px;padding:16px 18px;border-inline-start:4px solid var(--c);flex-wrap:wrap}
.lnum{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.found{padding:20px;border-inline-start:4px solid var(--gold)}
.found p{white-space:pre-line;font-size:18px!important;font-weight:500}
.found .demo{font-family:"Amiri Quran",serif;font-size:34px;direction:rtl;letter-spacing:6px;margin:6px 0 4px;color:var(--gold);line-height:2.2;padding-bottom:14px;word-spacing:14px}
.step{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:36px 0 -6px}
.cat-head .btn{margin-inline-start:auto;padding:8px 14px;font-size:14px;text-decoration:none}
.opt.phrase span{font-family:"Amiri Quran",serif;font-size:24px;direction:rtl;line-height:1.9}
.qrule{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:99px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.term{all:unset;cursor:pointer;border-bottom:2px dotted var(--brand);color:inherit}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--brand) 12%,transparent);border-radius:4px}
.big1{font-size:19px;font-weight:600;margin:8px 0 4px;line-height:1.5}
.when1{font-size:15px;color:var(--muted);margin:0 0 8px}
.kid{font-size:17px;line-height:1.6;margin:6px 0 12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft)}
.easy{display:grid;gap:6px;margin:4px 0 12px;font-size:16px}
.easy div{background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:10px;padding:8px 12px}
details.more summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:14px;margin:4px 0}
details.more p{margin:6px 0 0}
.ayah[data-key]{cursor:pointer}
.ayah[data-key]:hover{opacity:.85}
#pop{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
#pop.on{display:flex}
#pop .sheet{background:var(--surface);border-radius:20px 20px 0 0;max-width:640px;width:100%;padding:22px 22px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:80vh;overflow:auto}
@media (min-width:700px){#pop{align-items:center}#pop .sheet{border-radius:20px}}
#pop h3{font-size:20px;margin:0 0 8px}
#pop .simple{font-size:18px;line-height:1.6}
#pop .x{float:inline-end;border:none;background:var(--line);border-radius:99px;width:34px;height:34px;font-size:18px}
.tip{font-size:13px;color:var(--muted);margin:0 0 14px}
.bigword{font-family:"Amiri Quran",serif;direction:rtl;text-align:center;font-size:clamp(52px,12vw,84px);line-height:1.9;margin:6px 0}
.bigword .cl{cursor:default;transition:color .2s}
.bigword.tap .cl{cursor:pointer}
.bigword.tap .cl:hover{color:var(--brand)}
.cl.tg{color:var(--c)}
.cl.src{color:var(--gold)}
.cl.good{color:var(--ok)}
.cl.bad{color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:10px 0 18px}
.formula .fx{font-family:"Amiri Quran",serif;font-size:26px;padding:4px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,transparent);border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.formula .fx.src{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.formula .fx.txt{font-family:inherit;font-size:16px;font-weight:600}
.formula .op{font-size:26px;font-weight:700;color:var(--muted)}
.formula .res{font-size:18px;font-weight:700;padding:8px 16px;border-radius:14px;background:var(--c);color:#fff}
.center{text-align:center}
.rulelabel{text-align:center;font-weight:700;color:var(--c);letter-spacing:.02em}
.prompt{text-align:center;font-size:20px;font-weight:600;margin:4px 0 0}
.win{text-align:center;font-size:20px;font-weight:700;color:var(--ok);min-height:30px}
.pill{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-40px;font-style:normal;font-size:26px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@keyframes pop{from{transform:scale(.98);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.level{margin:0 0 12px}
.level>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:17px}
.level>summary::-webkit-details-marker{display:none}
.level[open]>summary{border-color:var(--brand)}
.lvicon{font-size:26px}
.lvbar{height:6px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--brand)}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 18px}
.hic{font-size:26px}
.hsc{font-weight:700;font-size:18px;text-align:center}.hsc small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.bkta{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 monospace;background:var(--bg,transparent);color:var(--ink);word-break:break-all}
.rcv{line-height:2.3}.rw{border-radius:8px;padding:0 4px}.rw.ok{background:var(--ok-soft)}.rw.no{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold)}
.rcaud{margin-top:12px}.rcaud audio{width:100%;margin-top:4px}
.rclive{margin-top:10px;font-size:15px}.rclive div{font-size:20px;color:var(--ink);margin-top:4px}
.acc{margin:0 0 24px}.acc h2{margin-top:0}
.acin{display:block;width:100%;margin-top:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface);color:var(--ink)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
@media (max-width:640px){
  .pill{order:2}
  .bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  nav{order:3;width:100%;margin:0;overflow-x:auto}
  nav a{white-space:nowrap}
  .lang{margin-inline-start:auto}
  .ayah{font-size:23px}
}

/* --- breathing room & layout fixes --- */
body{line-height:1.7;overflow-wrap:anywhere}
html,body{overflow-x:hidden}
main{padding:36px 0 96px}
.grid{gap:22px}
.card.pad,.pad{padding:26px}
.rule,.found{padding:24px}
.rule h3,.found h3{margin-bottom:10px}
.big1{margin:12px 0 8px}
.when1{margin:0 0 14px}
.ex{padding-top:16px;margin-top:16px}
.ayah{line-height:2.5;padding-top:6px}
.cat-head{margin:44px 0 18px}
.step{margin:48px 0 0}
p.lead{margin:0 0 28px}
.chips{gap:10px;margin:0 0 26px}
.row{gap:12px;margin-top:22px}
.qbox{padding:28px}
.bigword{line-height:2.1;margin:12px 0 22px}
.concept h2{margin-top:18px}
.logo .mark{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:22px;font-weight:700;line-height:36px;padding-bottom:4px}
.pill .lbl{font-weight:500;color:var(--muted);font-size:12px}
details.more{margin:14px 0 4px;border-top:1px dashed var(--line);padding-top:12px}
details.more summary{font-size:15px}
details.more p{font-size:16px;line-height:1.8}
@media (max-width:640px){
  header{position:static}
  .bar{padding:14px 20px!important}
  nav{position:sticky;top:0}
  .ayah{font-size:24px;line-height:2.4}
  .card.pad,.pad,.rule,.found{padding:22px 20px}
}
.pic{margin:4px 0 18px}
.legend{list-style:none;padding:0;margin:14px auto 0;max-width:360px;display:grid;gap:8px;text-align:start;font-size:15px}
.legend b{display:inline-block;min-width:18px}
.ladder{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:8px 0 6px}
html[dir=rtl] .ladder{flex-direction:row-reverse}
.ladder div{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px}
.ladder i{display:block;width:34px;border-radius:10px 10px 4px 4px;background:var(--c);opacity:.85}
.ladder b{font-family:"Amiri Quran",serif;font-size:17px;font-weight:400;line-height:1.6}
.ladder span{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.counts{display:grid;gap:12px;max-width:420px;margin:6px auto 10px;text-align:start}
.counts div{display:grid;grid-template-columns:auto 26px 1fr;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.counts .beads{color:var(--c);letter-spacing:1px;font-size:11px;min-width:76px;white-space:nowrap}
.counts b{font-size:20px}
.lcols{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 14px}
.lcols>div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;flex:0 1 auto;padding:10px 6px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,transparent)}
.lcols .lc{font-family:"Amiri Quran",serif;font-size:52px;line-height:1.7;color:var(--c)}
.lcols small{font-size:14px;color:var(--ink);font-weight:600;line-height:1.3;text-align:center}
.lcols small.snd{color:var(--muted);font-weight:500}
.lrows{display:grid;gap:10px;max-width:360px;margin:6px auto 16px;text-align:start}
.lrow1{display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,transparent)}
.lrow1 .lc{font-family:"Amiri Quran",serif;font-size:46px;line-height:1.6;color:var(--c);min-width:64px;text-align:center}
.lrow1 .eq{font-size:22px;color:var(--muted);font-weight:700}
.lrow1 .lx{display:flex;flex-direction:column;font-size:18px;line-height:1.4}
.lrow1 .lx b{font-size:22px}
.lines{display:grid;gap:8px;max-width:520px;margin:8px auto 4px;text-align:start}
.lines .lead-ar{font-family:"Amiri Quran",serif;font-size:30px;line-height:1.5;color:var(--c,var(--gold));flex:none;padding:0 4px;min-width:44px;text-align:center}
.lines div{display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--gold)) 9%,transparent)}

:root{--m-fat:#d32f2f;--m-kas:#1565c0;--m-dam:#2e7d32;--m-suk:#7b1fa2;--m-sha:#e65100;--m-mad:#00838f}
@media (prefers-color-scheme:dark){:root{--m-fat:#ff6b6b;--m-kas:#64b5f6;--m-dam:#81c784;--m-suk:#ce93d8;--m-sha:#ffb74d;--m-mad:#4dd0e1}}
.lines div.mc{border-inline-start:5px solid var(--lc);background:color-mix(in srgb,var(--lc) 10%,transparent)}
.lines div.mc .lead-ar{color:var(--ink)}
.found .demo .ink{color:var(--ink)}
.lines .mk{color:var(--lc);font-weight:700}
.term:not([data-v])::after{content:"ⓘ";font-size:.7em;margin-inline-start:2px;color:var(--brand);vertical-align:super}
@keyframes flipN{from{transform:perspective(900px) rotateY(-18deg) translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes flipP{from{transform:perspective(900px) rotateY(18deg) translateX(-30px);opacity:.3}to{transform:none;opacity:1}}
html[dir=rtl] .flipN{animation-name:flipP}html[dir=rtl] .flipP{animation-name:flipN}
.flipN,.flipP{animation:flipN .35s ease-out;transform-origin:center}
.flipP{animation-name:flipP}
.swipehint{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:18px}
.arw{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--brand);flex:none}
.arw:disabled{opacity:.3}
button.play{border:none;background:none;color:var(--brand);font:inherit;padding:0;cursor:pointer}
button.chip.play{border:1px solid var(--line);background:var(--surface);color:inherit;padding:6px 14px}
button.btn.play{background:var(--brand);color:#fff;padding:12px 22px}
.play.on{color:var(--ok)!important}
.ov{position:relative;display:inline-block}
.ovt{position:absolute;inset:0;color:var(--ink);pointer-events:none;-webkit-text-stroke:.09em var(--bgk,var(--surface));--bgk:color-mix(in srgb,var(--mc) 14%,var(--surface));paint-order:stroke fill}
.ovb{color:var(--mc);-webkit-text-stroke:.06em var(--mc)}
.found .demo .ov,.lines .lead-ar .ov{padding:0 .12em;border-radius:.3em;background:color-mix(in srgb,var(--mc) 14%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--mc) 35%,transparent)}
.found .demo .ov .ovt,.lines .lead-ar .ov .ovt{inset:0 .12em}
.lines div.mc{--bgk:color-mix(in srgb,var(--lc) 10%,var(--surface))}
.lines .lead-ar{font-size:42px!important;min-width:60px!important;line-height:2.2!important}
.found .demo{font-size:46px}

.gbanner{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 22px}
.gb{display:flex;align-items:center;gap:10px;padding:16px;border-radius:18px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#7c4dff,#00b0ff);box-shadow:var(--shadow);font-size:16px}
.gb+.gb{background:linear-gradient(135deg,#ff6d00,#ff4081)}
.gb span{font-size:30px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gask{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--lc) 12%,transparent);border-inline-start:5px solid var(--lc);font-size:18px}
.gask-l{font-family:"Amiri Quran",serif;font-size:44px;line-height:1.5}
.gstars{text-align:center;font-size:26px;letter-spacing:4px;margin:12px 0}
.gstars .dim{opacity:.18}
.pond{position:relative;height:56vh;min-height:360px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#b3e5fc33,#81d4fa55);border:1px solid var(--line)}
.bub{position:absolute;bottom:-90px;width:78px;height:78px;border-radius:50%;border:2px solid #ffffffaa;background:radial-gradient(circle at 30% 30%,#ffffffee,#e1f5fecc 40%,#b3e5fc88);box-shadow:0 4px 14px #0288d133;font-family:"Amiri Quran",serif;font-size:38px;line-height:1;display:grid;place-items:center;color:#1d2a26;animation:rise linear forwards;padding:0}
.bub .ovt{color:#1d2a26}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-56vh - 200px))}}
@media (max-height:700px){@keyframes rise{to{transform:translateY(-560px)}}}
.bub.popd{animation:popb .3s ease-out forwards!important}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.bub.wob{animation-name:rise,wob;animation-duration:inherit,.4s}
@keyframes wob{25%{margin-left:-6px}75%{margin-left:6px}}
.mem{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc2{position:relative;height:110px;border-radius:18px;border:2px solid var(--line);background:var(--surface);padding:8px;transition:transform .3s,background .3s}
.mc2 .back{font-size:30px;color:#fff}
.mc2:not(.up){background:linear-gradient(135deg,#ff6d00,#ff4081);border-color:transparent}
.mc2:not(.up) .face{display:none}
.mc2.up .back{display:none}
.mc2.up{transform:rotateY(0);animation:flipc .3s}
@keyframes flipc{from{transform:rotateY(90deg)}}
.mc2 b{font-size:15px;color:var(--c)}
.mc2 .mw{font-family:"Amiri Quran",serif;font-size:26px;line-height:1.7}
.mc2.got{border-color:var(--ok);background:var(--ok-soft)}
.chip{padding:8px 16px;min-height:38px}
nav a{padding:10px 14px}
.mark2{width:48px;height:48px;flex:none;display:block}
.mark2 svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(11,63,53,.25))}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.zoom button{border:none;background:none;padding:6px 12px;font-weight:700;font-size:15px;min-height:38px}
.zoom button+button{border-inline-start:1px solid var(--line)}
.zoom button:disabled{opacity:.35}
nav a{display:inline-flex;align-items:center;gap:6px}
.ni{font-size:16px}
@media (max-width:640px){
  nav{display:grid!important;grid-template-columns:repeat(3,1fr);gap:8px;overflow:visible!important;position:static!important}
  nav a{flex-direction:column;justify-content:center;gap:2px;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;text-align:center;min-height:58px}
  nav a.active{border-color:var(--brand)}
  .ni{font-size:20px}
  .zoom{margin-inline-start:auto}
  .lang{margin-inline-start:0!important}
}
.bar{flex-wrap:wrap;height:auto;padding:12px 0;row-gap:10px}
nav{order:3;width:100%;margin:0;flex-wrap:wrap}
nav a{white-space:nowrap}
.zoom{margin-inline-start:auto}
.vwords{font-family:"Amiri Quran",serif;font-size:28px;line-height:2.3;text-align:right;margin:8px 0}
.vw{all:unset;cursor:pointer;padding:0 4px;border-radius:8px;transition:background .15s}
.vw:hover,.vw:focus-visible{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.vw.hl{background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold)}
.vw.on{background:color-mix(in srgb,var(--ok) 25%,transparent)}
.vwm{color:var(--muted);font-size:.7em}
.chip.say.on{border-color:var(--ok);color:var(--ok)}
.mxbox{max-width:420px;margin:0 auto}
.mx{display:block;max-width:360px;margin:0 auto;color:var(--ink)}
.mx g,.mx ellipse,.mx circle,.mx rect,.mx path{transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.mx-tongue.on{filter:drop-shadow(0 0 4px #e57373)}
.mx-th.on{opacity:1!important;animation:mxp 1s infinite}
.mx-throat.on{opacity:.3!important}
.mx-nose.on{opacity:.75!important;animation:mxp 1s infinite}
.mx-air.on{opacity:.9!important;animation:mxa 1s linear infinite}
.mx-palate.on{opacity:.8!important}
@keyframes mxp{50%{opacity:.4}}
@keyframes mxa{to{stroke-dashoffset:-24}}
.mxinfo{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:14px;background:var(--gold-soft);margin:10px 0;font-size:16px;line-height:1.5}
.mxkeys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 12px}
.mxk{font-family:"Amiri Quran",serif;font-size:22px;min-width:54px;padding:2px 10px;border-radius:12px;border:2px solid color-mix(in srgb,var(--k) 45%,transparent);background:color-mix(in srgb,var(--k) 12%,transparent);color:var(--ink);line-height:1.8}
.mxk.on{background:var(--k);color:#fff}
.mxcard{margin:0 0 22px}
.mxcard summary{cursor:pointer;font-size:17px;list-style:none}
.mxcard[open] summary{margin-bottom:12px}
/* --- game --- */
.gwrap{max-width:560px;margin:0 auto}
.garden{font-size:34px;text-align:center;letter-spacing:4px;min-height:52px;margin:6px 0 10px}
.gword{font-family:"Amiri Quran",serif;direction:rtl;text-align:center;font-size:clamp(46px,12vw,72px);line-height:2;margin:10px 0 6px;color:var(--c)}
.gopts{display:grid;gap:14px;margin-top:18px}
.gopt{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px;font-size:19px;font-weight:600;text-align:center;transition:transform .12s}
.gopt:active{transform:scale(.98)}
.gopt.right{border-color:var(--ok);background:var(--ok-soft)}
.gopt.soft{opacity:.45}
.gmsg{text-align:center;font-size:19px;font-weight:600;min-height:32px;margin-top:16px}
.ghint{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--gold-soft);font-size:17px;line-height:1.7}
.gmodes{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:10px}
.gmode{text-align:start;padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.gmode .ic{font-size:36px;margin-bottom:8px}
.gmode h3{margin:0 0 6px}
.gmode p{margin:0;color:var(--muted)}
</style>

رة وتُرقّق مرة: اللام (في لفظ الجلالة)، والراء، والألف."}, {"big": "رَ رُ  ·  رِ", "ar_big": true, "ten": "The letter ر", "tar": "الراء", "en": "رَ or رُ = heavy. رِ = light.", "ar": "الراء المفتوحة أو المضمومة مفخّمة، والمكسورة مرقّقة."}, {"big": "قَالَ · كَانَ", "ar_big": true, "ten": "The letter ا", "tar": "الألف", "en": "Alif copies the letter before it. قَا = heavy. كَا = light.", "ar": "الألف تتبع ما قبلها: «قَا» مفخّمة، «كَا» مرقّقة."}], "quiz": [{"qen": "Which letter is always heavy?", "qar": "أي حرف مفخّم دائمًا؟", "opts": [["ص", "ص"], ["س", "س"], ["ت", "ت"]], "wen": "ص is one of خص ضغط قظ.", "war": "الصاد من «خص ضغط قظ»."}, {"qen": "رِ (with a kasrah) is…", "qar": "الراء المكسورة رِ…", "opts": [["light", "مرقّقة"], ["heavy", "مفخّمة"]], "wen": "Kasrah makes ر light.", "war": "الكسر يرقّق الراء."}, {"qen": "رَ (with a fatḥah) is…", "qar": "الراء المفتوحة رَ…", "opts": [["heavy", "مفخّمة"], ["light", "مرقّقة"]], "wen": "Fatḥah makes ر heavy.", "war": "الفتح يفخّم الراء."}, {"qen": "The alif in قَالَ is…", "qar": "الألف في «قَالَ»…", "opts": [["heavy", "مفخّمة"], ["light", "مرقّقة"]], "wen": "It comes after ق, a heavy letter.", "war": "جاءت بعد القاف وهي مفخّمة."}, {"qen": "Which group is the always-heavy letters?", "qar": "ما المجموعة المفخّمة دائمًا؟", "opts": [["خص ضغط قظ", "خص ضغط قظ"], ["ي ن م و", "ي ن م و"], ["ق ط ب ج د", "ق ط ب ج د"]], "wen": "خص ضغط قظ = 7 heavy letters.", "war": "«خص ضغط قظ» سبعة حروف مفخّمة."}]}, "wasl": {"en": "The silent hamzah (hamzat al-waṣl)", "ar": "همزة الوصل ( ٱ )", "color": "#4f7cac", "steps": [{"big": "ٱ", "ar_big": true, "ten": "Hamzat al-waṣl", "tar": "همزة الوصل", "en": "This alif with a little head ( ٱ ) is silent when you join it to the word before.", "ar": "الألف التي عليها رأس صاد صغير ( ٱ ) لا تُنطق عند وصلها بما قبلها."}, {"big": "وَٱلْقَمَرِ", "ar_big": true, "ten": "Joining", "tar": "عند الوصل", "en": "Joined: skip it. Say “wal-qamar”, not “wa-al-qamar”.", "ar": "في الوصل تسقط: «وَلْقَمَرِ».", "ref": "91:2"}, {"big": "ٱلْحَمْدُ ← اَلْحَمْدُ", "ar_big": true, "ten": "Starting with ال", "tar": "البدء بـ «ال»", "en": "Starting a word with ٱل? Say it with “a”: al‑ḥamdu.", "ar": "تبدأ بكلمة فيها «ٱل»؟ انطق الهمزة مفتوحة: اَلْحَمْدُ.", "ref": "1:2"}, {"big": "ٱدْعُ ← اُدْعُ", "ar_big": true, "ten": "Verb, 3rd letter has ḍammah", "tar": "فعل ثالثه مضموم", "en": "3rd letter has a ḍammah? Start with “u”: ud‘u.", "ar": "إذا كان ثالث الفعل مضمومًا فابدأ بالضم: اُدْعُ.", "ref": "16:125"}, {"big": "ٱذْهَبْ ← اِذْهَبْ", "ar_big": true, "ten": "Verb, 3rd letter not ḍammah", "tar": "فعل ثالثه غير مضموم", "en": "Otherwise start with “i”: idh-hab. Nouns like ٱبْن and ٱسْم also start with “i”.", "ar": "وإلا فابدأ بالكسر: اِذْهَبْ. وكذلك الأسماء مثل «ٱبْن» و«ٱسْم».", "ref": "20:24"}], "quiz": [{"qen": "How do you start the word ٱلْحَمْدُ?", "qar": "كيف تبدأ بكلمة ٱلْحَمْدُ؟", "opts": [["al-ḥamdu (with “a”)", "اَلْحَمْدُ (بالفتح)"], ["il-ḥamdu", "اِلْحَمْدُ"], ["ul-ḥamdu", "اُلْحَمْدُ"]], "wen": "ٱل always starts with “a”.", "war": "«ٱل» تبدأ بالفتح دائمًا."}, {"qen": "How do you start ٱدْعُ?", "qar": "كيف تبدأ بـ ٱدْعُ؟", "opts": [["ud‘u (with “u”)", "اُدْعُ (بالضم)"], ["id‘u", "اِدْعُ"], ["ad‘u", "اَدْعُ"]], "wen": "The 3rd letter ع has a ḍammah.", "war": "ثالثه العين مضمومة."}, {"qen": "In وَٱلْقَمَرِ, the ٱ is…", "qar": "في «وَٱلْقَمَرِ» الهمزة…", "opts": [["silent", "لا تُنطق"], ["said with “a”", "تُنطق بالفتح"]], "wen": "Joined to و, so it drops.", "war": "وُصلت بالواو فسقطت."}, {"qen": "How do you start ٱذْهَبْ?", "qar": "كيف تبدأ بـ ٱذْهَبْ؟", "opts": [["idh-hab (with “i”)", "اِذْهَبْ (بالكسر)"], ["udh-hab", "اُذْهَبْ"]], "wen": "The 3rd letter ه has a fatḥah, not ḍammah.", "war": "ثالثه الهاء مفتوحة لا مضمومة."}]}, "sifat": {"en": "Letter traits (ṣifāt)", "ar": "صفات الحروف", "color": "#8a6d3b", "steps": [{"big": "😌 · 😤", "ar_big": false, "ten": "What are traits?", "tar": "ما الصفات؟", "en": "Letters have personalities. Two letters from the same spot sound different because of their traits.", "ar": "للحروف صفات كالشخصيات، فيختلف صوت الحرفين وإن خرجا من مكان واحد."}, {"big": "فَحَثَّهُ شَخْصٌ سَكَتَ", "ar_big": true, "ten": "Whisper (hams)", "tar": "الهمس", "en": "With these 10 letters, some breath escapes, like a whisper: ف ح ث ه ش خ ص س ك ت", "ar": "مع هذه الحروف العشرة يجري النَّفَس كالهمس: ف ح ث ه ش خ ص س ك ت"}, {"big": "أَجِدُ قَطٍ بَكَتْ", "ar_big": true, "ten": "Strong stop (shiddah)", "tar": "الشدة", "en": "With these 8 letters, the sound stops completely: أ ج د ق ط ب ك ت", "ar": "مع هذه الحروف الثمانية ينحبس الصوت تمامًا: أ ج د ق ط ب ك ت"}, {"big": "لِنْ عُمَرْ", "ar_big": true, "ten": "In-between (tawassuṭ)", "tar": "التوسط", "en": "These 5 are in between: the sound flows a little: ل ن ع م ر", "ar": "هذه الخمسة بين الشدة والرخاوة: ل ن ع م ر"}, {"big": "خُصَّ ضَغْطٍ قِظْ", "ar_big": true, "ten": "Tongue rises (istiʿlāʾ)", "tar": "الاستعلاء", "en": "The back of the tongue rises. That's why these 7 are heavy.", "ar": "يرتفع أقصى اللسان، ولهذا هذه السبعة مفخّمة."}, {"big": "ص ض ط ظ", "ar_big": true, "ten": "Tongue covers (iṭbāq)", "tar": "الإطباق", "en": "The tongue covers the roof of the mouth. These 4 are the heaviest.", "ar": "ينطبق اللسان على سقف الفم، وهذه الأربعة أقوى الحروف تفخيمًا."}, {"big": "ص ز س", "ar_big": true, "ten": "Whistle (ṣafīr)", "tar": "الصفير", "en": "A small whistle sound, like a bird.", "ar": "صوت صفير خفيف كصوت الطائر."}], "quiz": [{"qen": "Which letter has a whistle?", "qar": "أي حرف فيه صفير؟", "opts": [["س", "س"], ["م", "م"], ["ع", "ع"]], "wen": "ص ز س whistle.", "war": "الصفير في ص ز س."}, {"qen": "Which letter lets breath escape (whisper)?", "qar": "أي حرف فيه همس؟", "opts": [["ه", "ه"], ["ب", "ب"], ["د", "د"]], "wen": "ه is in فحثه شخص سكت.", "war": "الهاء من «فحثه شخص سكت»."}, {"qen": "With which letter does the sound stop completely?", "qar": "مع أي حرف ينحبس الصوت تمامًا؟", "opts": [["ب", "ب"], ["س", "س"], ["ل", "ل"]], "wen": "ب is in أجد قط بكت.", "war": "الباء من «أجد قط بكت»."}, {"qen": "Which letter covers the roof of the mouth?", "qar": "أي حرف فيه إطباق؟", "opts": [["ط", "ط"], ["ت", "ت"], ["ق", "ق"]], "wen": "ص ض ط ظ are the covering letters.", "war": "حروف الإطباق ص ض ط ظ."}]}, "two": {"en": "When two letters meet", "ar": "المثلان والمتجانسان والمتقاربان", "color": "#5b8c5a", "steps": [{"big": "بْ + ب", "ar_big": true, "ten": "The idea", "tar": "الفكرة", "en": "When a letter with sukūn meets the next letter, sometimes they merge into one doubled letter.", "ar": "إذا التقى حرف ساكن بالحرف الذي بعده، فقد يُدغم فيه فيصيران حرفًا مشددًا."}, {"big": "رَبِحَت تِّجَـٰرَتُهُمْ", "ar_big": true, "ten": "Twins (mithlayn)", "tar": "المثلان", "en": "Same letter twice, first has sukūn → always merge. تْ + ت = تّ", "ar": "حرفان متماثلان والأول ساكن ← يُدغم دائمًا: تْ + ت = تّ", "ref": "2:16"}, {"big": "قَد تَّبَيَّنَ", "ar_big": true, "ten": "Cousins (mutajānisayn)", "tar": "المتجانسان", "en": "Same spot, different letters. Merge in a few pairs, like د → ت.", "ar": "مخرج واحد وصفات مختلفة. يُدغم في مواضع معيّنة مثل الدال في التاء.", "ref": "2:256"}, {"big": "بَسَطتَ", "ar_big": true, "ten": "A cousin that keeps its weight", "tar": "إدغام ناقص", "en": "ط merges into ت, but you keep a little of ط's heaviness.", "ar": "تُدغم الطاء في التاء مع بقاء صفة الإطباق.", "ref": "5:28"}, {"big": "ٱرْكَب مَّعَنَا", "ar_big": true, "ten": "Another cousin pair", "tar": "مثال آخر", "en": "بْ meets م → merge into مّ, with a hum.", "ar": "الباء الساكنة قبل الميم ← تُدغم فيها مع غنة.", "ref": "11:42"}, {"big": "وَقُل رَّبِّ", "ar_big": true, "ten": "Neighbours (mutaqāribayn)", "tar": "المتقاربان", "en": "Close spots. لْ meets ر → merge: “wa qur-rabbi”.", "ar": "مخرجان متقاربان: اللام الساكنة قبل الراء ← تُدغم.", "ref": "20:114"}, {"big": "نَخْلُقكُّم", "ar_big": true, "ten": "Another neighbour", "tar": "مثال آخر", "en": "ق merges into ك. Full merge is preferred.", "ar": "تُدغم القاف في الكاف، والإدغام الكامل أولى.", "ref": "77:20"}], "quiz": [{"qen": "Same letter twice, first with sukūn. What happens?", "qar": "حرفان متماثلان والأول ساكن. ما الحكم؟", "opts": [["merge", "إدغام"], ["say both clearly", "إظهار"]], "wen": "Twins always merge.", "war": "المثلان يُدغمان."}, {"qen": "In قَد تَّبَيَّنَ, what merges?", "qar": "في «قَد تَّبَيَّنَ» ما الذي يُدغم؟", "opts": [["د into ت", "الدال في التاء"], ["ت into د", "التاء في الدال"], ["nothing", "لا إدغام"]], "wen": "دْ merges into ت.", "war": "الدال الساكنة تُدغم في التاء."}, {"qen": "In بَسَطتَ, you…", "qar": "في «بَسَطتَ»…", "opts": [["merge but keep some heaviness", "تُدغم مع بقاء الإطباق"], ["say ط fully", "تُظهر الطاء"], ["drop the ت", "تحذف التاء"]], "wen": "It's an incomplete merge.", "war": "إدغام ناقص."}, {"qen": "وَقُل رَّبِّ: what do you do with the ل?", "qar": "«وَقُل رَّبِّ»: ما حكم اللام؟", "opts": [["merge it into ر", "تُدغم في الراء"], ["say it clearly", "تُظهر"]], "wen": "لْ and ر are neighbours, so they merge.", "war": "اللام والراء متقاربان فتُدغم."}]}, "waqf": {"en": "Stopping & starting", "ar": "الوقف والابتداء", "color": "#b5651d", "steps": [{"big": "✋", "ar_big": false, "ten": "Good stopping", "tar": "الوقف الصحيح", "en": "Stop where the meaning is complete. Don't stop in a place that breaks the meaning.", "ar": "قف حيث يتمّ المعنى، ولا تقف في موضع يُفسده."}, {"big": "مـ  ·  لا  ·  ج", "ar_big": true, "ten": "Stop signs (1)", "tar": "علامات الوقف ١", "en": "م = must stop · لا = don't stop here · ج = stop or join, both fine", "ar": "م = وقف لازم · لا = لا تقف · ج = يجوز الوقف والوصل"}, {"big": "صلى  ·  قلى  ·  ∴ ∴", "ar_big": true, "ten": "Stop signs (2)", "tar": "علامات الوقف ٢", "en": "صلى = joining is better · قلى = stopping is better · ∴ ∴ = stop at one of the two, not both", "ar": "صلى = الوصل أولى · قلى = الوقف أولى · ∴ ∴ = قف على إحداهما لا كلتيهما"}, {"big": "↩️", "ar_big": false, "ten": "Starting again", "tar": "الابتداء", "en": "After a stop, start again from a place that makes sense, even if you go back a little.", "ar": "بعد الوقف ابدأ من موضع يصحّ به المعنى، ولو رجعت قليلًا."}, {"big": "عِوَجَا ۜ قَيِّمًا", "ar_big": true, "ten": "Saktah (pause, no breath)", "tar": "السكتة", "en": "A short pause of 2 counts without taking a breath. Hafs has 4 places. Look for the small س ( ۜ ).", "ar": "سكتة قصيرة بقدر حركتين بلا تنفّس. لحفص ٤ مواضع، وعلامتها سين صغيرة ( ۜ ).", "ref": "18:1"}, {"big": "مَّرْقَدِنَا ۜ  ·  مَنْ ۜ رَاقٍ  ·  بَلْ ۜ رَانَ", "ar_big": true, "ten": "The other 3 saktāt", "tar": "السكتات الثلاث الأخرى", "en": "Yā-Sīn 36:52 · Al-Qiyāmah 75:27 · Al-Muṭaffifīn 83:14", "ar": "يس ٥٢ · القيامة ٢٧ · المطففين ١٤"}], "quiz": [{"qen": "The small sign م above the line means…", "qar": "العلامة الصغيرة م فوق السطر تعني…", "opts": [["you must stop", "وقف لازم"], ["don't stop", "لا تقف"], ["stop or join", "يجوز الأمران"]], "wen": "م is the must-stop sign.", "war": "م علامة الوقف اللازم."}, {"qen": "A saktah is…", "qar": "السكتة هي…", "opts": [["a short pause without breath", "وقفة قصيرة بلا تنفّس"], ["a long stop with a breath", "وقف طويل مع تنفّس"], ["a stretch of 6 counts", "مدّ ست حركات"]], "wen": "No breath, about 2 counts.", "war": "بلا تنفّس، بقدر حركتين."}, {"qen": "How many saktāt does Hafs have?", "qar": "كم سكتة لحفص؟", "opts": [["4", "٤"], ["2", "٢"], ["7", "٧"]], "wen": "Al-Kahf, Yā-Sīn, Al-Qiyāmah, Al-Muṭaffifīn.", "war": "الكهف ويس والقيامة والمطففين."}, {"qen": "∴ ∴ means…", "qar": "∴ ∴ تعني…", "opts": [["stop at one, not both", "قف على إحداهما فقط"], ["stop at both", "قف على كليهما"], ["never stop", "لا تقف أبدًا"]], "wen": "These are paired signs.", "war": "علامتا تعانق."}]}, "special": {"en": "Special Hafs words", "ar": "كلمات خاصة في رواية حفص", "color": "#8b3a62", "steps": [{"big": "مَجْر۪ىٰهَا", "ar_big": true, "ten": "Imālah (lean)", "tar": "الإمالة", "en": "Say رَا leaning towards “re”, like “majrēhā”. The only one in Hafs.", "ar": "تُمال الراء والألف نحو الكسر: «مَجْرِيهَا» بين بين. الموضع الوحيد لحفص.", "ref": "11:41"}, {"big": "ءَا۬عْجَمِىٌّ", "ar_big": true, "ten": "Tas-hīl (soft hamzah)", "tar": "التسهيل", "en": "Say the 2nd hamzah softly, between a hamzah and an alif.", "ar": "تُسهَّل الهمزة الثانية بين الهمزة والألف.", "ref": "41:44"}, {"big": "لَا تَأْمَ۫نَّا", "ar_big": true, "ten": "Ishmām (round your lips)", "tar": "الإشمام", "en": "While merging the ن, round your lips a little, like saying “u” silently.", "ar": "عند إدغام النون تضمّ شفتيك قليلًا كأنك تشير إلى الضمة.", "ref": "12:11"}, {"big": "وَيَبْصُۜطُ", "ar_big": true, "ten": "Written ص, read س", "tar": "تُكتب صادًا وتُقرأ سينًا", "en": "Read it with س: “yabsuṭ”. A small س on top reminds you.", "ar": "تُقرأ بالسين: «يَبْسُطُ». والسين الصغيرة فوقها تذكّرك.", "ref": "2:245"}, {"big": "ضَعْفٍ · ضُعْفٍ", "ar_big": true, "ten": "Two ways", "tar": "وجهان", "en": "In Ar-Rūm 30:54, ضَعْف can be read with fatḥah or ḍammah on ض.", "ar": "في سورة الروم ٥٤ يجوز فتح الضاد وضمّها في «ضعف».", "ref": "30:54"}], "quiz": [{"qen": "Which word has imālah in Hafs?", "qar": "أي كلمة فيها إمالة عند حفص؟", "opts": [["مَجْر۪ىٰهَا", "مَجْر۪ىٰهَا"], ["ٱلْحَمْدُ", "ٱلْحَمْدُ"], ["قُلْ", "قُلْ"]], "wen": "Hūd 11:41, the only one.", "war": "هود ٤١، الموضع الوحيد."}, {"qen": "وَيَبْصُۜطُ (Al-Baqarah 2:245) is read with…", "qar": "«وَيَبْصُۜطُ» تُقرأ بـ…", "opts": [["س", "السين"], ["ص", "الصاد"]], "wen": "The small س tells you.", "war": "السين الصغيرة تدلّك."}, {"qen": "In ءَا۬عْجَمِىٌّ, the 2nd hamzah is…", "qar": "في «ءَا۬عْجَمِىٌّ» الهمزة الثانية…", "opts": [["said softly (tas-hīl)", "مسهّلة"], ["dropped", "محذوفة"], ["stretched 6", "تُمدّ ستًّا"]], "wen": "Soft, between hamzah and alif.", "war": "بين الهمزة والألف."}, {"qen": "In لَا تَأْمَ۫نَّا you…", "qar": "في «لَا تَأْمَ۫نَّا»…", "opts": [["round your lips while merging", "تضمّ شفتيك مع الإدغام"], ["say two clear ن", "تُظهر النونين"]], "wen": "That's ishmām.", "war": "هذا الإشمام."}]}, "letters": {"en": "Meet the letters", "ar": "تعرّف على الحروف", "color": "#c08a2e", "steps": [{"big": "ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي", "ar_big": true, "ten": "28 letters", "tar": "٢٨ حرفًا", "en": "Arabic has 28 letters. You read from right to left ←", "ar": "العربية ٢٨ حرفًا، وتُقرأ من اليمين إلى اليسار ←"}, {"big": "ب  ت  ث", "ar_big": true, "ten": "Same shape, different dots", "tar": "شكل واحد ونقاط مختلفة", "en": "Same body. Only the dots change.", "ar": "الشكل واحد، والنقاط فقط تتغيّر.", "cols": [["ب", "1 dot below", "نقطة تحت", "b"], ["ت", "2 dots above", "نقطتان فوق", "t"], ["ث", "3 dots above", "ثلاث نقاط فوق", "th"]]}, {"big": "ج  ح  خ", "ar_big": true, "ten": "Another family", "tar": "عائلة أخرى", "en": "Another family. Same body, different dots.", "ar": "عائلة أخرى: شكل واحد ونقاط مختلفة.", "cols": [["ج", "dot inside", "نقطة في الوسط", "j"], ["ح", "no dot", "بلا نقطة", "ḥ"], ["خ", "dot on top", "نقطة فوق", "kh"]]}, {"big": "د ذ · ر ز · س ش", "ar_big": true, "ten": "Pairs", "tar": "أزواج", "en": "Each pair: adding dots makes a new letter.", "ar": "في كل زوج: النقاط تصنع حرفًا جديدًا.", "cols": [["د", "no dot", "بلا نقطة", "d"], ["ذ", "1 dot", "نقطة", "dh"], ["ر", "no dot", "بلا نقطة", "r"], ["ز", "1 dot", "نقطة", "z"], ["س", "no dots", "بلا نقاط", "s"], ["ش", "3 dots", "ثلاث نقاط", "sh"]]}, {"big": "ص ض · ط ظ · ع غ", "ar_big": true, "ten": "More pairs", "tar": "أزواج أخرى", "en": "Same idea: the dotted one is a different letter.", "ar": "الفكرة نفسها: المنقوط حرف آخر.", "cols": [["ص", "no dot", "بلا نقطة", "ṣ"], ["ض", "1 dot", "نقطة", "ḍ"], ["ط", "no dot", "بلا نقطة", "ṭ"], ["ظ", "1 dot", "نقطة", "ẓ"], ["ع", "no dot", "بلا نقطة", "ʿayn"], ["غ", "1 dot", "نقطة", "ghayn"]]}, {"big": "بـ  ـبـ  ـب", "ar_big": true, "ten": "Letters hold hands", "tar": "الحروف تتصل", "en": "Letters change shape a little when they join.", "ar": "يتغيّر شكل الحرف قليلًا عند الاتصال.", "cols": [["بـ", "start", "أول الكلمة", ""], ["ـبـ", "middle", "وسط الكلمة", ""], ["ـب", "end", "آخر الكلمة", ""]]}], "quiz": [{"qen": "Which letter has 1 dot below?", "qar": "أي حرف تحته نقطة واحدة؟", "opts": [["ب", "ب"], ["ت", "ت"], ["ث", "ث"]], "wen": "ب = b, one dot below.", "war": "الباء نقطة تحتها."}, {"qen": "Arabic is read…", "qar": "العربية تُقرأ…", "opts": [["right to left", "من اليمين إلى اليسار"], ["left to right", "من اليسار إلى اليمين"]], "wen": "Start on the right side ←", "war": "ابدأ من اليمين ←"}, {"qen": "Which letter has a dot on top?", "qar": "أي حرف فوقه نقطة؟", "opts": [["خ", "خ"], ["ح", "ح"], ["ج", "ج"]], "wen": "خ = kh.", "war": "الخاء نقطتها فوق."}, {"qen": "How many letters are there?", "qar": "كم عدد الحروف؟", "opts": [["28", "٢٨"], ["20", "٢٠"], ["35", "٣٥"]], "wen": "28 letters.", "war": "٢٨ حرفًا."}]}, "exam": {"en": "Mastery exam", "ar": "اختبار الإتقان", "color": "#0f5c4d", "steps": [{"big": "🏆", "ar_big": false, "ten": "Final exam", "tar": "الاختبار النهائي", "en": "12 questions from everything you learned. Take your time. You can redo it any day.", "ar": "١٢ سؤالًا من كل ما تعلّمته. خذ وقتك، ويمكنك إعادته متى شئت."}], "quiz": []}, "madd2": {"en": "More kinds of madd", "ar": "أنواع أخرى من المد", "color": "#c2185b", "steps": [{"big": "ءَامَنُوا۟", "ar_big": true, "ten": "Madd badal (hamzah first)", "tar": "مد البدل", "en": "A hamzah comes BEFORE the madd letter. Stretch 2 counts, like a normal madd.", "ar": "تأتي الهمزة قبل حرف المد. يُمدّ حركتين مثل المد الطبيعي.", "more": ["Examples: ءَامَنُوا۟ · إِيمَـٰنًا · أُوتُوا۟. The name “badal” means “replacement”: the madd letter replaced a second hamzah long ago (ءَأْمَنُوا → ءَامَنُوا). In Ḥafṣ it is always 2 counts.", "أمثلة: ءَامَنُوا۟ · إِيمَـٰنًا · أُوتُوا۟. سُمّي «بدلًا» لأن حرف المد بدلٌ من همزة ثانية في الأصل (ءَأْمَنُوا ← ءَامَنُوا). ومقداره عند حفص حركتان فقط."], "pic": "counts"}, {"big": "عَلِيمًا ← عَلِيمَا", "ar_big": true, "ten": "Madd ʿiwaḍ (stopping on ـًا)", "tar": "مد العوض", "en": "Stopping on a word that ends with ـً (two fatḥahs)? Drop the “n” and say a long “aa” for 2 counts.", "ar": "تقف على كلمة آخرها تنوين فتح؟ احذف صوت النون وقل ألفًا ممدودة حركتين.", "more": ["When you keep reading, say the tanwīn normally: ʿalīman ḥakīmā. Only when you STOP does it become ʿalīmā. This does not happen with ـٌ or ـٍ: there you just stop with sukūn. Words ending in ة (like رَحْمَةً) are stopped on with a ه sound, not with an alif.", "عند الوصل تنطق التنوين كما هو: «عَلِيمًا حَكِيمًا». وعند الوقف فقط تقول «عَلِيمَا». ولا يكون هذا مع تنوين الضم أو الكسر، بل تقف عليهما بالسكون. أما المختوم بتاء مربوطة مثل «رَحْمَةً» فيُوقف عليه بالهاء لا بالألف."]}, {"big": "إِنَّهُۥ كَانَ", "ar_big": true, "ten": "Madd ṣilah ṣughrā (small)", "tar": "مد الصلة الصغرى", "en": "The هُ or هِ meaning “him/it” sits between two vowelled letters? Stretch it 2 counts, like هُو / هِي.", "ar": "هاء الضمير بين حرفين متحركين؟ تُمدّ حركتين، فتُنطق «هُو» أو «هِي».", "more": ["The Mushaf shows it with a small و ( ۥ ) or a small ي ( ۦ ) after the ه. If you stop on the word, the stretch is dropped and you stop on a plain ه with sukūn.", "يُرسم في المصحف واوًا صغيرة ( ۥ ) أو ياءً صغيرة ( ۦ ) بعد الهاء. وإذا وقفت على الكلمة سقط المدّ ووقفت على الهاء ساكنة."]}, {"big": "مَالَهُۥٓ أَخْلَدَهُۥ", "ar_big": true, "ten": "Madd ṣilah kubrā (big)", "tar": "مد الصلة الكبرى", "en": "Same as the small one, but a hamzah comes right after. Stretch 4–5 counts.", "ar": "مثل الصغرى، لكن بعدها همزة مباشرة. تُمدّ ٤–٥ حركات.", "more": ["Al-Humazah 104:3. It behaves like madd munfaṣil: the stretch, then a hamzah at the start of the next word. Look for the wavy madd sign ( ٓ ) on the small و or ي.", "سورة الهمزة ٣. حكمه حكم المد المنفصل: مدٌّ ثم همزة في أول الكلمة التالية. وتجد علامة المد ( ٓ ) فوق الواو أو الياء الصغيرة."]}, {"big": "ٱلْحَآقَّةُ", "ar_big": true, "ten": "Lāzim kalimī muthaqqal", "tar": "اللازم الكلمي المثقّل", "en": "In ONE word: a madd letter, then a letter with shaddah. Always 6 counts.", "ar": "في كلمة واحدة: حرف مد بعده حرف مشدد. ٦ حركات دائمًا.", "more": ["“Kalimī” = inside a word. “Muthaqqal” = heavy, because the next letter has a shaddah. Examples: ٱلضَّآلِّينَ · ٱلطَّآمَّةُ · دَآبَّةٍ.", "«كلمي» أي في كلمة، و«مثقّل» لأن الحرف بعد المد مشدد. أمثلة: ٱلضَّآلِّينَ · ٱلطَّآمَّةُ · دَآبَّةٍ."]}, {"big": "ءَآلْـَٔـٰنَ", "ar_big": true, "ten": "Lāzim kalimī mukhaffaf", "tar": "اللازم الكلمي المخفّف", "en": "In ONE word: a madd letter, then a plain sukūn (no shaddah). 6 counts. Only in this word, twice in Sūrat Yūnus.", "ar": "في كلمة واحدة: حرف مد بعده سكون بلا تشديد. ٦ حركات. لا يأتي إلا في هذه الكلمة، مرتين في سورة يونس.", "more": ["Yūnus 10:51 and 10:91. Ḥafṣ may also read it with tas-hīl (a soft second hamzah), but the 6-count madd is the most common way taught.", "يونس ٥١ و ٩١. ولحفص فيها وجه التسهيل أيضًا، لكن المدّ ست حركات هو الوجه المقدَّم في التعليم."]}], "quiz": [{"qen": "ءَامَنُوا۟ has which madd?", "qar": "ما نوع المد في «ءَامَنُوا۟»؟", "opts": [["madd badal (2)", "مد البدل (٢)"], ["madd lāzim (6)", "مد لازم (٦)"], ["madd ʿiwaḍ", "مد العوض"]], "wen": "The hamzah comes before the madd letter.", "war": "الهمزة قبل حرف المد."}, {"qen": "Stopping on عَلِيمًا, you say…", "qar": "عند الوقف على «عَلِيمًا» تقول…", "opts": [["ʿalīmā (long a)", "عَلِيمَا"], ["ʿalīman", "عَلِيمًا بالتنوين"], ["ʿalīm", "عَلِيمْ"]], "wen": "That is madd ʿiwaḍ.", "war": "هذا مد العوض."}, {"qen": "مَالَهُۥٓ أَخْلَدَهُۥ: how long is the هُۥٓ?", "qar": "«مَالَهُۥٓ أَخْلَدَهُۥ»: كم تُمدّ الهاء؟", "opts": [["4–5 counts", "٤–٥ حركات"], ["2 counts", "حركتان"], ["no stretch", "لا تُمدّ"]], "wen": "A hamzah comes after it: ṣilah kubrā.", "war": "بعدها همزة: صلة كبرى."}, {"qen": "ٱلْحَآقَّةُ is stretched…", "qar": "«ٱلْحَآقَّةُ» تُمدّ…", "opts": [["6 counts", "٦ حركات"], ["2 counts", "حركتين"], ["4 counts", "٤ حركات"]], "wen": "Madd letter + shaddah = lāzim.", "war": "حرف مد ثم شدة = لازم."}, {"qen": "Small madd ṣilah is stretched…", "qar": "مد الصلة الصغرى مقداره…", "opts": [["2 counts", "حركتان"], ["6 counts", "٦ حركات"], ["0", "لا مد"]], "wen": "Like a normal madd.", "war": "مثل المد الطبيعي."}]}, "harfi": {"en": "Opening letters of sūrahs", "ar": "الحروف المقطّعة (الٓمٓ)", "color": "#ad1457", "steps": [{"big": "الٓمٓ · يسٓ · نٓ", "ar_big": true, "ten": "What are they?", "tar": "ما هي؟", "en": "29 sūrahs start with separate letters. You read them by their NAMES: الٓمٓ = alif · lām · mīm.", "ar": "تبدأ ٢٩ سورة بحروف منفصلة. تُقرأ بأسمائها: الٓمٓ = ألِفْ · لَامْ · مِيمْ.", "more": ["Only Allah knows their full meaning. They are 14 different letters in total.", "الله أعلم بمرادها. وهي ١٤ حرفًا مختلفًا."]}, {"big": "نَقَصَ عَسَلُكُمْ", "ar_big": true, "ten": "6 counts", "tar": "ست حركات", "en": "Letters whose name has 3 sounds with a madd in the middle: stretch 6. They are in نَقَصَ عَسَلُكُمْ.", "ar": "الحروف التي اسمها ثلاثة أحرف وسطها حرف مد: تُمدّ ست حركات. يجمعها «نَقَصَ عَسَلُكُمْ».", "more": ["ن ق ص ع س ل ك م. Example: قٓ = qāāāāf. The letter ع (in كٓهيعٓصٓ and حمٓ عٓسٓقٓ) may be stretched 4 or 6, and 6 is preferred.", "ن ق ص ع س ل ك م. مثال: قٓ = «قَااااف». وحرف العين (في كهيعص و حم عسق) يجوز فيه ٤ أو ٦، والست أفضل."]}, {"big": "حَيٌّ طَهُرَ", "ar_big": true, "ten": "2 counts", "tar": "حركتان", "en": "Letters whose name has 2 sounds: stretch only 2. They are in حَيٌّ طَهُرَ.", "ar": "الحروف التي اسمها حرفان: تُمدّ حركتين. يجمعها «حَيٌّ طَهُرَ».", "more": ["ح ي ط ه ر. Example: طه = ṭā hā, each with a normal 2-count stretch.", "ح ي ط ه ر. مثال: طه = «طَا هَا» بمدّ حركتين لكل منهما."]}, {"big": "ا", "ar_big": true, "ten": "No madd", "tar": "لا مدّ", "en": "The letter alif (ا) has no madd. Just say “alif”.", "ar": "الألف لا مدّ فيها. تقول «أَلِفْ» فقط.", "more": ["Its name أَلِفْ has no madd letter in the middle, so nothing to stretch.", "لأن اسمها «أَلِفْ» ليس وسطه حرف مد."]}, {"big": "الٓمٓ ← أَلِفْ لَامّْ مِيمْ", "ar_big": true, "ten": "Merging inside الٓمٓ", "tar": "الإدغام في الٓمٓ", "en": "In الٓمٓ the م of “lām” merges into “mīm”, so you get a shaddah and a hum: lāāām‑mīīīm.", "ar": "في «الٓمٓ» تُدغم ميم «لام» في ميم «ميم»، فتصير مشددة مع غنة: لَامِّيمْ.", "more": ["When the madd comes before a letter with shaddah like this, it is called lāzim ḥarfī muthaqqal. When it is a plain sukūn (like مٓ at the end), it is lāzim ḥarfī mukhaffaf. Both are 6 counts.", "إذا جاء بعد المد حرف مشدد سُمّي «لازمًا حرفيًا مثقّلًا»، وإذا جاء بعده سكون بلا تشديد (مثل ميم الأخيرة) سُمّي «لازمًا حرفيًا مخفّفًا». وكلاهما ست حركات."]}], "quiz": [{"qen": "How long is قٓ?", "qar": "كم يُمدّ «قٓ»؟", "opts": [["6 counts", "٦ حركات"], ["2 counts", "حركتان"], ["no madd", "لا مد"]], "wen": "ق is in نقص عسلكم.", "war": "القاف من «نقص عسلكم»."}, {"qen": "How long is the ط in طه?", "qar": "كم يُمدّ الطاء في «طه»؟", "opts": [["2 counts", "حركتان"], ["6 counts", "٦ حركات"], ["4 counts", "٤ حركات"]], "wen": "ط is in حي طهر.", "war": "الطاء من «حي طهر»."}, {"qen": "The letter ا in الٓمٓ is…", "qar": "الألف في «الٓمٓ»…", "opts": [["not stretched", "لا تُمدّ"], ["stretched 6", "تُمدّ ٦"], ["stretched 2", "تُمدّ ٢"]], "wen": "Alif has no madd.", "war": "الألف لا مد فيها."}, {"qen": "You read الٓمٓ as…", "qar": "تُقرأ «الٓمٓ»…", "opts": [["alif lām mīm", "أَلِفْ لَامْ مِيمْ"], ["alam", "أَلَمْ"], ["al-m", "أَلْم"]], "wen": "By the letters' names.", "war": "بأسماء الحروف."}]}, "glevels": {"en": "Levels of ghunnah", "ar": "مراتب الغنة", "color": "#e65100", "steps": [{"big": "نّ · مّ", "ar_big": true, "ten": "Ghunnah lives in ن and م", "tar": "الغنة في النون والميم", "en": "Every ن and م has a hum. But the hum is not always the same size. There are 5 levels.", "ar": "في كل نون وميم غنة، لكنها ليست بالقدر نفسه دائمًا. لها ٥ مراتب.", "more": ["Ghunnah is the sound that comes out of your nose. Try holding your nose while saying “nnn”: the sound stops. That is how you know it comes from the nose.", "الغنة صوت يخرج من الأنف. جرّب أن تمسك أنفك وتقول «ننن»: سينقطع الصوت، وهكذا تعرف أنها من الأنف."], "pic": "glevels"}, {"big": "إِنَّ · ثُمَّ", "ar_big": true, "ten": "1. Strongest: shaddah", "tar": "١. أقواها: المشدد", "en": "ن or م with shaddah. The fullest hum, 2 counts.", "ar": "النون أو الميم المشددة. أكمل غنة، بمقدار حركتين.", "more": ["This level also includes idghām with ghunnah when it is complete (like مِن نُّورٍ), because the merged letter becomes doubled.", "ويدخل فيها الإدغام بغنة الكامل (مثل مِن نُّورٍ) لأن الحرف المدغم يصير مشددًا."]}, {"big": "مَن يَقُولُ", "ar_big": true, "ten": "2. Merged (idghām)", "tar": "٢. المدغم", "en": "ن merging into و or ي. A full hum, 2 counts.", "ar": "النون المدغمة في الواو أو الياء. غنة كاملة حركتين.", "more": ["Merging into و or ي is “incomplete” (nāqiṣ) because a bit of the ن stays, so it is just under level 1.", "الإدغام في الواو والياء إدغام ناقص لبقاء صفة الغنة، فهو دون المرتبة الأولى قليلًا."]}, {"big": "أَنتَ · مِن قَبْلُ", "ar_big": true, "ten": "3. Hidden (ikhfāʾ)", "tar": "٣. المخفى", "en": "Hidden ن or م before the next letter. A full hum, 2 counts.", "ar": "النون أو الميم المخفاة. غنة كاملة حركتين.", "more": ["Iqlāb (ن turning into م before ب) and ikhfāʾ shafawī (مْ before ب) are in this level too.", "ويدخل فيها الإقلاب والإخفاء الشفوي."]}, {"big": "أَنْعَمْتَ", "ar_big": true, "ten": "4. Clear with sukūn", "tar": "٤. الساكن المظهر", "en": "ن or م with sukūn said clearly (iẓhār). Only a tiny hum, not stretched.", "ar": "النون أو الميم الساكنة المُظهَرة. غنة قليلة جدًا، بلا إطالة.", "more": ["Don't add 2 counts here. The hum is just part of the letter's natural sound.", "لا تمدّ الغنة هنا؛ هي جزء من صوت الحرف فقط."]}, {"big": "نَ · مُ", "ar_big": true, "ten": "5. Weakest: with a vowel", "tar": "٥. أضعفها: المتحرك", "en": "ن or م with a vowel (ـَ ـِ ـُ). The smallest hum.", "ar": "النون أو الميم المتحركة. أقل غنة.", "more": ["Levels 1–3 are held for 2 counts. Levels 4–5 are just the natural sound of the letter.", "المراتب ١–٣ تُمدّ بقدر حركتين، والمرتبتان ٤–٥ صوت الحرف الطبيعي فقط."]}], "quiz": [{"qen": "Which has the strongest ghunnah?", "qar": "أيّها أقوى غنة؟", "opts": [["إِنَّ", "إِنَّ"], ["أَنْعَمْتَ", "أَنْعَمْتَ"], ["نَ", "نَ"]], "wen": "Shaddah = strongest.", "war": "المشدد أقواها."}, {"qen": "Which has the weakest ghunnah?", "qar": "أيّها أضعف غنة؟", "opts": [["نَ (with a vowel)", "نَ (متحركة)"], ["ثُمَّ", "ثُمَّ"], ["أَنتَ", "أَنتَ"]], "wen": "A vowelled ن is the weakest.", "war": "النون المتحركة أضعفها."}, {"qen": "How many levels of ghunnah?", "qar": "كم مرتبة للغنة؟", "opts": [["5", "٥"], ["3", "٣"], ["2", "٢"]], "wen": "Shaddah, merged, hidden, clear, vowelled.", "war": "المشدد، المدغم، المخفى، الساكن المظهر، المتحرك."}, {"qen": "أَنتَ is which level?", "qar": "«أَنتَ» من أي مرتبة؟", "opts": [["hidden (ikhfāʾ)", "المخفى"], ["shaddah", "المشدد"], ["vowelled", "المتحرك"]], "wen": "ن before ت is hidden.", "war": "النون قبل التاء مخفاة."}]}, "ra": {"en": "The letter ر: heavy or light", "ar": "الراء: تفخيم وترقيق", "color": "#6d4c41", "steps": [{"big": "رَ · رُ", "ar_big": true, "ten": "Heavy with fatḥah or ḍammah", "tar": "تُفخّم بالفتح والضم", "en": "ر with ـَ or ـُ is heavy (full, round sound). رَبِّ · رُسُلٌ", "ar": "الراء المفتوحة أو المضمومة مفخّمة. رَبِّ · رُسُلٌ", "more": ["Heavy means you raise the back of your tongue so the sound is full and deep, as if your mouth is a bit rounder.", "التفخيم أن ترفع مؤخرة اللسان فيمتلئ الفم بالصوت."]}, {"big": "رِ", "ar_big": true, "ten": "Light with kasrah", "tar": "تُرقّق بالكسر", "en": "ر with ـِ is light (thin sound). رِجَالٌ · ٱلرِّيحَ", "ar": "الراء المكسورة مرقّقة. رِجَالٌ · ٱلرِّيحَ", "more": ["Light means the tongue stays low and the sound is thin, like the English “r” in “ring”.", "الترقيق أن يبقى اللسان منخفضًا فيكون الصوت نحيفًا."]}, {"big": "يَرْجِعُونَ · فِرْعَوْنَ", "ar_big": true, "ten": "ر with sukūn: look BEFORE it", "tar": "الراء الساكنة: انظر قبلها", "en": "Before it ـَ or ـُ → heavy (يَرْجِعُونَ). Before it ـِ → light (فِرْعَوْنَ).", "ar": "قبلها فتح أو ضم ← تُفخّم (يَرْجِعُونَ). قبلها كسر ← تُرقّق (فِرْعَوْنَ).", "more": ["One exception: if the kasrah before it is on a hamzat al-waṣl, the ر is heavy: ٱرْجِعِىٓ. Another: if a heavy letter (خ ص ض غ ط ق ظ) comes right after it in the same word, it is heavy: قِرْطَاسٍ · مِرْصَادًا. In فِرْقٍ (Ash-Shuʿarāʾ 26:63) both are allowed.", "استثناء: إذا كان الكسر قبلها على همزة وصل فُخّمت: ٱرْجِعِىٓ. واستثناء آخر: إذا جاء بعدها حرف استعلاء في الكلمة نفسها فُخّمت: قِرْطَاسٍ · مِرْصَادًا. وفي «فِرْقٍ» (الشعراء ٦٣) يجوز الوجهان."]}, {"big": "ٱلْقَدْرِ ✋ · خَيْرٌ ✋", "ar_big": true, "ten": "Stopping on ر", "tar": "الوقف على الراء", "en": "Stopping on ر? Look at the letter before it. Kasrah or يْ before → light (خَيْرٌ). Otherwise → heavy (ٱلْقَدْرِ).", "ar": "تقف على الراء؟ انظر قبلها: كسر أو ياء ساكنة ← ترقيق (خَيْرٌ). غير ذلك ← تفخيم (ٱلْقَدْرِ).", "more": ["In ٱلْقَدْرِ the letter before ر is دْ (sukūn), so look one more back: ـَ on the ق → heavy. In words like مِصْرَ and ٱلْقِطْرِ both heavy and light are allowed when stopping.", "في «ٱلْقَدْرِ» قبل الراء دال ساكنة، فننظر إلى ما قبلها: قاف مفتوحة ← تفخيم. وفي «مِصْرَ» و«ٱلْقِطْرِ» يجوز الوجهان عند الوقف."]}], "quiz": [{"qen": "رَبِّ: the ر is…", "qar": "«رَبِّ»: الراء…", "opts": [["heavy", "مفخّمة"], ["light", "مرقّقة"], ["silent", "لا تُنطق"]], "wen": "Fatḥah → heavy.", "war": "مفتوحة ← تفخيم."}, {"qen": "فِرْعَوْنَ: the ر is…", "qar": "«فِرْعَوْنَ»: الراء…", "opts": [["light", "مرقّقة"], ["heavy", "مفخّمة"], ["doubled", "مشددة"]], "wen": "Sukūn with kasrah before → light.", "war": "ساكنة قبلها كسر ← ترقيق."}, {"qen": "رِجَالٌ: the ر is…", "qar": "«رِجَالٌ»: الراء…", "opts": [["light", "مرقّقة"], ["heavy", "مفخّمة"], ["bounced", "مقلقلة"]], "wen": "Kasrah → light.", "war": "مكسورة ← ترقيق."}, {"qen": "ٱرْجِعِىٓ: the ر is…", "qar": "«ٱرْجِعِىٓ»: الراء…", "opts": [["heavy", "مفخّمة"], ["light", "مرقّقة"], ["merged", "مدغمة"]], "wen": "The kasrah is on hamzat al-waṣl.", "war": "الكسر على همزة الوصل."}, {"qen": "Stopping on خَيْرٌ, the ر is…", "qar": "عند الوقف على «خَيْرٌ» الراء…", "opts": [["light", "مرقّقة"], ["heavy", "مفخّمة"], ["silent", "لا تُنطق"]], "wen": "يْ before it → light.", "war": "قبلها ياء ساكنة ← ترقيق."}]}, "sakinayn": {"en": "Two sukūns meeting", "ar": "التقاء الساكنين", "color": "#00838f", "steps": [{"big": "ـْ + ـْ", "ar_big": true, "ten": "The idea", "tar": "الفكرة", "en": "Arabic can't say two sukūns in a row. So when they meet between two words, one of them changes.", "ar": "لا يجتمع ساكنان في النطق. فإذا التقيا بين كلمتين تغيّر أحدهما.", "more": ["Inside one word (like ٱلضَّآلِّينَ) the madd is stretched 6 instead: that is madd lāzim, which you already learned.", "أما في الكلمة الواحدة (مثل ٱلضَّآلِّينَ) فيُمدّ ست حركات، وهذا المد اللازم الذي تعلّمته."]}, {"big": "فِى ٱلْأَرْضِ", "ar_big": true, "ten": "Madd letter first: drop it", "tar": "الأول حرف مد: يُحذف نطقًا", "en": "A word ends in ا و ي and the next starts with a sukūn? Don't say the madd. فِى ٱلْأَرْضِ = “fil-arḍ”.", "ar": "كلمة آخرها حرف مد وبعدها ساكن؟ لا تنطق المد. «فِى ٱلْأَرْضِ» = «فِلْأَرْضِ».", "more": ["More: وَقَالَا ٱلْحَمْدُ = “wa qālal-ḥamdu”. The letter is still written, you just don't pronounce it when joining. If you stop on the first word, you say the madd normally.", "ومثله: «وَقَالَا ٱلْحَمْدُ» = «وَقَالَلْحَمْدُ». الحرف مكتوب لكنه لا يُنطق عند الوصل، فإذا وقفت على الكلمة الأولى نطقته."]}, {"big": "قُمِ ٱلَّيْلَ", "ar_big": true, "ten": "Other sukūn first: give it a kasrah", "tar": "الأول غير حرف مد: يُكسر", "en": "The first word ends with a normal sukūn? Give it a ـِ to join. قُمْ + ٱلَّيْلَ = قُمِ ٱلَّيْلَ.", "ar": "آخر الكلمة الأولى ساكن صحيح؟ يُحرّك بالكسر للوصل: قُمْ + ٱلَّيْلَ = قُمِ ٱلَّيْلَ.", "more": ["Sometimes it takes a ḍammah or fatḥah instead, and the Mushaf already prints the right vowel for you, e.g. مِنَ ٱللَّهِ, عَلَيْهِمُ ٱلذِّلَّةُ. Just read what is written.", "وقد يُحرّك بالضم أو الفتح، والمصحف يضع الحركة الصحيحة، مثل: مِنَ ٱللَّهِ · عَلَيْهِمُ ٱلذِّلَّةُ. اقرأ المكتوب."]}, {"big": "نُوحٌ ٱبْنَهُ ← نُوحُنِ ٱبْنَهُ", "ar_big": true, "ten": "Tanwīn before a sukūn", "tar": "التنوين قبل ساكن", "en": "Tanwīn + a sukūn: the hidden ن gets a ـِ. The Mushaf shows a small ن. Hūd 11:42.", "ar": "تنوين بعده ساكن: تُكسر نون التنوين للوصل، ويُكتب في المصحف نون صغيرة. هود ٤٢.", "more": ["Another example: خَيْرًا ٱلْوَصِيَّةُ (Al-Baqarah 2:180) = “khayranil-waṣiyyah”.", "ومثله: «خَيْرًا ٱلْوَصِيَّةُ» (البقرة ١٨٠) = «خَيْرَنِلْوَصِيَّةُ»."]}], "quiz": [{"qen": "فِى ٱلْأَرْضِ joined is said…", "qar": "«فِى ٱلْأَرْضِ» عند الوصل تُنطق…", "opts": [["fil-arḍ", "فِلْأَرْضِ"], ["fīī al-arḍ", "فِي ٱلْأَرْضِ بمدّ"], ["fi-ʾal-arḍ", "فِ أَلْأَرْضِ"]], "wen": "Drop the madd letter when joining.", "war": "يُحذف حرف المد عند الوصل."}, {"qen": "قُمْ + ٱلَّيْلَ becomes…", "qar": "«قُمْ» + «ٱلَّيْلَ» تصير…", "opts": [["قُمِ ٱلَّيْلَ", "قُمِ ٱلَّيْلَ"], ["قُمْ ٱلَّيْلَ", "قُمْ ٱلَّيْلَ"], ["قُمَ ٱلَّيْلَ", "قُمَ ٱلَّيْلَ"]], "wen": "A kasrah joins them.", "war": "يُحرّك بالكسر."}, {"qen": "A small ن in the Mushaf after tanwīn means…", "qar": "النون الصغيرة بعد التنوين تعني…", "opts": [["say a ن with kasrah", "تُنطق نونًا مكسورة"], ["skip it", "لا تُنطق"], ["stop here", "قف هنا"]], "wen": "Like نُوحُنِ ٱبْنَهُ.", "war": "مثل «نُوحُنِ ٱبْنَهُ»."}, {"qen": "Can two sukūns be said in a row between words?", "qar": "هل يجتمع ساكنان في النطق بين كلمتين؟", "opts": [["No, one changes", "لا، يتغيّر أحدهما"], ["Yes, always", "نعم دائمًا"], ["Only in Ḥafṣ", "عند حفص فقط"]], "wen": "One is dropped or given a vowel.", "war": "يُحذف أحدهما أو يُحرّك."}]}, "haa": {"en": "The هُ / هِ of “him”", "ar": "هاء الضمير", "color": "#558b2f", "steps": [{"big": "هُ · هِ", "ar_big": true, "ten": "What is it?", "tar": "ما هي؟", "en": "A ه at the end of a word that means “him” or “it”. لَهُ = for him. بِهِ = with it.", "ar": "هاء في آخر الكلمة تعني «هو» للغائب. لَهُ · بِهِ", "more": ["It is never the ه that is part of the root (like the ه in ٱللَّهُ or يَنتَهِ). Only the “him/it” ending.", "ليست الهاء الأصلية في الكلمة (مثل هاء لفظ الجلالة)، بل هاء الضمير الزائدة فقط."]}, {"big": "إِنَّهُۥ كَانَ", "ar_big": true, "ten": "Between two vowels → stretch", "tar": "بين متحركين ← تُمدّ", "en": "Vowel before it AND vowel after it? Stretch it 2 (look for the small ۥ or ۦ).", "ar": "قبلها متحرك وبعدها متحرك؟ تُمدّ حركتين (تجد واوًا أو ياءً صغيرة).", "more": ["If a hamzah comes after, it becomes 4–5 counts (ṣilah kubrā), as in مَالَهُۥٓ أَخْلَدَهُۥ.", "وإذا جاء بعدها همزة مُدّت ٤–٥ حركات (صلة كبرى) كما في «مَالَهُۥٓ أَخْلَدَهُۥ»."]}, {"big": "فِيهِ · لَهُ ٱلْمُلْكُ", "ar_big": true, "ten": "Sukūn next to it → short", "tar": "بجوارها ساكن ← لا تُمدّ", "en": "A sukūn right before it (فِيهِ, عَلَيْهِ) or right after it (لَهُ ٱلْمُلْكُ)? Say it short. No stretch.", "ar": "إذا سبقها ساكن (فِيهِ · عَلَيْهِ) أو جاء بعدها ساكن (لَهُ ٱلْمُلْكُ)؟ تُنطق قصيرة بلا مد.", "more": ["The Mushaf helps you: when there is no small و or ي after the ه, don't stretch it.", "المصحف يساعدك: إذا لم تجد واوًا أو ياءً صغيرة بعد الهاء فلا تمدّها."]}, {"big": "فِيهِۦ مُهَانًا", "ar_big": true, "ten": "Special Ḥafṣ places", "tar": "مواضع خاصة لحفص", "en": "فِيهِۦ مُهَانًا (Al-Furqān 25:69) IS stretched, even with ي before it. يَرْضَهُ لَكُمْ (Az-Zumar 39:7) is NOT stretched.", "ar": "«فِيهِۦ مُهَانًا» (الفرقان ٦٩) تُمدّ مع أن قبلها ساكنًا. و«يَرْضَهُ لَكُمْ» (الزمر ٧) لا تُمدّ.", "more": ["Also with sukūn on the ه: أَرْجِهْ (Al-Aʿrāf 7:111, Ash-Shuʿarāʾ 26:36) and فَأَلْقِهْ (An-Naml 27:28). And in عَلَيْهُ ٱللَّهَ (Al-Fatḥ 48:10) and أَنسَىٰنِيهُ (Al-Kahf 18:63) Ḥafṣ reads the ه with ḍammah.", "ومثلها بالسكون: «أَرْجِهْ» (الأعراف ١١١ والشعراء ٣٦) و«فَأَلْقِهْ» (النمل ٢٨). ويقرأ حفص «عَلَيْهُ ٱللَّهَ» (الفتح ١٠) و«أَنسَىٰنِيهُ» (الكهف ٦٣) بضم الهاء."]}], "quiz": [{"qen": "إِنَّهُۥ كَانَ: the هُ is…", "qar": "«إِنَّهُۥ كَانَ»: الهاء…", "opts": [["stretched 2", "تُمدّ حركتين"], ["short", "قصيرة"], ["stretched 6", "تُمدّ ٦"]], "wen": "Between two vowelled letters.", "war": "بين متحركين."}, {"qen": "عَلَيْهِ: the هِ is…", "qar": "«عَلَيْهِ»: الهاء…", "opts": [["short", "قصيرة"], ["stretched 2", "تُمدّ حركتين"], ["stretched 4", "تُمدّ ٤"]], "wen": "A sukūn (يْ) comes before it.", "war": "قبلها ساكن."}, {"qen": "Which one IS stretched in Ḥafṣ?", "qar": "أيّها تُمدّ عند حفص؟", "opts": [["فِيهِۦ مُهَانًا", "فِيهِۦ مُهَانًا"], ["يَرْضَهُ لَكُمْ", "يَرْضَهُ لَكُمْ"], ["لَهُ ٱلْمُلْكُ", "لَهُ ٱلْمُلْكُ"]], "wen": "Al-Furqān 25:69 is a special place.", "war": "موضع الفرقان خاص."}, {"qen": "لَهُ ٱلْمُلْكُ: the هُ is…", "qar": "«لَهُ ٱلْمُلْكُ»: الهاء…", "opts": [["short", "قصيرة"], ["stretched", "ممدودة"], ["silent", "لا تُنطق"]], "wen": "A sukūn comes after it.", "war": "بعدها ساكن."}]}, "alif": {"en": "Letters written but not read", "ar": "حروف تُكتب ولا تُقرأ", "color": "#5e35b1", "steps": [{"big": "قَالُوا۟", "ar_big": true, "ten": "The little circle ( ۟ )", "tar": "الدائرة الصغيرة ( ۟ )", "en": "A small circle on a letter means: don't read it. Ever. قَالُوا۟ = “qālū”.", "ar": "الدائرة الصغيرة فوق الحرف تعني: لا يُقرأ أبدًا. «قَالُوا۟» = «قَالُو».", "more": ["You often see it on the alif after the “they” و (قَالُوا۟, ءَامَنُوا۟) and in words like أُو۟لَـٰٓئِكَ (read “ulāʾika”).", "تراها كثيرًا على الألف بعد واو الجماعة (قَالُوا۟ · ءَامَنُوا۟) وفي مثل «أُو۟لَـٰٓئِكَ» (تُقرأ: أُلَائِكَ)."]}, {"big": "أَنَا۠", "ar_big": true, "ten": "The oval ( ۠ ): read it only when you stop", "tar": "البيضاوية ( ۠ ): تُقرأ عند الوقف فقط", "en": "An oval sign on the alif means: skip it when joining, say it when you stop. أَنَا۠ joined = “ana”, stopped = “anā”.", "ar": "العلامة البيضاوية على الألف تعني: تُحذف في الوصل وتُنطق في الوقف. «أَنَا۠» وصلًا «أَنَ»، ووقفًا «أَنَا».", "more": ["Same in لَّـٰكِنَّا۠ (Al-Kahf 18:38), and in Al-Aḥzāb: ٱلظُّنُونَا۠ (33:10), ٱلرَّسُولَا۠ (33:66), ٱلسَّبِيلَا۠ (33:67).", "ومثلها «لَّـٰكِنَّا۠» (الكهف ٣٨)، وفي الأحزاب: «ٱلظُّنُونَا۠» (١٠) و«ٱلرَّسُولَا۠» (٦٦) و«ٱلسَّبِيلَا۠» (٦٧)."]}, {"big": "قَوَارِيرَا۠ · قَوَارِيرَا۟", "ar_big": true, "ten": "Al-Insān: two quwārīrā", "tar": "قوارير في سورة الإنسان", "en": "First قَوَارِيرَا۠ (76:15): read the alif when you stop. Second قَوَارِيرَا۟ (76:16): never read it.", "ar": "الأولى «قَوَارِيرَا۠» (١٥): تُقرأ الألف عند الوقف. الثانية «قَوَارِيرَا۟» (١٦): لا تُقرأ أبدًا.", "more": ["And سَلَـٰسِلَا۠ (76:4): when stopping, you may say it with the alif (salāsilā) or with sukūn (salāsil). Joined, the alif is dropped.", "و«سَلَـٰسِلَا۠» (٤): عند الوقف يجوز إثبات الألف أو الوقف بالسكون، وتُحذف في الوصل."]}], "quiz": [{"qen": "A small circle ( ۟ ) on a letter means…", "qar": "الدائرة الصغيرة ( ۟ ) فوق الحرف تعني…", "opts": [["never read it", "لا يُقرأ أبدًا"], ["stretch it", "يُمدّ"], ["stop here", "قف هنا"]], "wen": "Like the alif in قَالُوا۟.", "war": "مثل ألف «قَالُوا۟»."}, {"qen": "أَنَا۠ when joined is…", "qar": "«أَنَا۠» في الوصل…", "opts": [["“ana” (short)", "«أَنَ» بلا ألف"], ["“anā” (long)", "«أَنَا» بالألف"], ["“an”", "«أَنْ»"]], "wen": "The alif is read only when stopping.", "war": "الألف تُقرأ وقفًا فقط."}, {"qen": "The 2nd قَوَارِيرَا۟ (76:16) when stopping is…", "qar": "«قَوَارِيرَا۟» الثانية عند الوقف…", "opts": [["without the alif", "بلا ألف"], ["with the alif", "بالألف"], ["with tanwīn", "بالتنوين"]], "wen": "Its alif is never read.", "war": "ألفها لا تُقرأ أبدًا."}, {"qen": "أُو۟لَـٰٓئِكَ is read…", "qar": "«أُو۟لَـٰٓئِكَ» تُقرأ…", "opts": [["ulāʾika", "أُلَائِكَ"], ["ūlāʾika", "أُولَائِكَ بمدّ الواو"], ["awlāʾika", "أَوْلَائِكَ"]], "wen": "The و has the small circle.", "war": "الواو عليها دائرة صغيرة."}]}};
const KID={"izhar": ["Throat letters live far back in your throat. ن lives at the front. They are too far apart to mix. So ن just says its sound clearly.", "حروف الحلق في آخر الحلق، والنون في مقدمة الفم. هما بعيدتان فلا تختلطان، فتنطق النون واضحة."], "idghamG": ["ن is shy. When it meets ي ن م و, it hides inside them. But it leaves its hum, so you still hear “nnn”.", "النون خجولة؛ إذا قابلت ي ن م و دخلت فيها، لكنها تترك غنتها فتسمع «ننن»."], "idghamN": ["ل and ر are strong. ن jumps into them and disappears. No hum.", "اللام والراء قويتان؛ تقفز النون فيهما وتختفي بلا غنة."], "iqlab": ["ن and ب don't sound nice together. So ن dresses up as م before ب.", "النون والباء لا تنسجمان، فتلبس النون ثوب الميم قبل الباء."], "ikhfa": ["ن hides behind the next letter, like a kid peeking from behind a door. Half there. You hear a hum.", "النون تختبئ خلف الحرف التالي، كطفل يطلّ من خلف الباب: نصف ظاهرة، مع غنة."], "ikhfaS": ["م uses your lips. ب uses your lips too. So keep the lips soft and hum.", "الميم تحتاج الشفتين، والباء كذلك؛ فاجعل الشفتين خفيفتين وغُنّ."], "idghamS": ["Two م's meet, like two hands making one clap. Say one long م with a hum.", "ميمان تلتقيان كيدين تصفقان صفقة واحدة، فتنطق ميمًا واحدة مع غنة."], "izharS": ["م meets any other letter. Just say “m” clearly and keep going.", "الميم تقابل حرفًا آخر، فانطقها واضحة وتابع."], "ghunnah": ["See نّ or مّ? Hum like humming a song: “nnn” or “mmm”, for 2 taps.", "ترى نّ أو مّ؟ دندن من أنفك «ننن» أو «ممم» بقدر نقرتين."], "qalS": ["ق ط ب ج د are bouncy balls. With a sukūn, let them bounce a little.", "ق ط ب ج د كرات مطاطية؛ إذا سكنت فاجعلها تقفز قليلًا."], "qalK": ["When you stop at the end, the bouncy ball bounces higher. Make it clear.", "عند الوقف في الآخر تقفز الكرة أعلى، فاجعلها واضحة."], "lamQ": ["The moon doesn't hide the stars. With moon letters, you hear the ل.", "القمر لا يخفي النجوم؛ فمع الحروف القمرية تسمع اللام."], "lamS": ["The sun is so bright you can't see stars. With sun letters, the ل disappears.", "الشمس قوية تخفي النجوم؛ فمع الحروف الشمسية تختفي اللام."], "jalH": ["After an “a” or “u” sound, say Allah with a big round mouth. Deep and full.", "بعد الفتحة أو الضمة، قل «الله» بفم كبير مستدير."], "jalL": ["After an “i” sound, your mouth is smiling. Say Allah thin and soft.", "بعد الكسرة يكون فمك كأنه يبتسم، فقل «الله» برقة."], "tabii": ["A normal long sound, like “baa”. 2 taps. That's all.", "مد عادي مثل «بَا»: نقرتان فقط."], "muttasil": ["Long vowel and ء are in the same word, holding hands. Stretch longer: 4 or 5 taps.", "حرف المد والهمزة في كلمة واحدة يمسكان بأيدي بعض، فمُدّ ٤ أو ٥ نقرات."], "munfasil": ["Long vowel ends one word. ء starts the next word. Neighbours. Stretch 4 or 5 taps.", "حرف المد في آخر كلمة والهمزة في أول التالية، كجارين. مُدّ ٤ أو ٥ نقرات."], "lazim": ["Long vowel runs into a shaddah, like a big wall. Always stretch the most: 6 taps.", "حرف المد يصطدم بشدة كجدار كبير، فتمدّ دائمًا ٦ نقرات."], "arid": ["You stop at the end of the verse to breathe. That makes the long vowel stretchy: 2, 4 or 6 taps.", "تقف في آخر الآية لتتنفس، فيصير المد مرنًا: ٢ أو ٤ أو ٦ نقرات."], "leen": ["Like “ay” in “day” or “ow” in “now”. When you stop after it, you may stretch it softly.", "مثل «أَيْ» و«أَوْ». إذا وقفت بعدها جاز أن تمدّها بلين."]};
const TRANS={"2:16":"Those are the ones who have purchased error [in exchange] for guidance, so their transaction has brought no profit, nor were they guided.","2:256":"There shall be no compulsion in [acceptance of] the religion. The right course has become distinct from the wrong. So whoever disbelieves in ṭāghūt and believes in Allāh has grasped the most trustworthy handhold with no break in it. And Allāh is Hearing and Knowing.","5:28":"If you should raise your hand toward me to kill me - I shall not raise my hand toward you to kill you. Indeed, I fear Allāh, Lord of the worlds.","11:41":"And [Noah] said, \"Embark therein; in the name of Allāh [are] its course and its anchorage. Indeed, my Lord is Forgiving and Merciful.\"","11:42":"And it sailed with them through waves like mountains, and Noah called to his son who was apart [from them], \"O my son, come aboard with us and be not with the disbelievers.\"","20:114":"So high [above all] is Allāh, the Sovereign, the Truth. And, [O Muḥammad], do not hasten with [recitation of] the Qur’ān before its revelation is completed to you, and say, \"My Lord, increase me in knowledge.\"","77:20":"Did We not create you from a liquid disdained?","41:44":"And if We had made it a foreign [i.e., non-Arabic] Qur’ān, they would have said, \"Why are its verses not explained in detail [in our language]? Is it a foreign [recitation] and an Arab [messenger]?\" Say, \"It is, for those who believe, a guidance and cure.\" And those who do not believe - in their ears is deafness, and it is upon them blindness. Those are being called from a distant place.","12:11":"They said, \"O our father, why do you not entrust us with Joseph while indeed, we are to him sincere counselors?","2:245":"Who is it that would loan Allāh a goodly loan so He may multiply it for him many times over? And it is Allāh who withholds and grants abundance, and to Him you will be returned.","30:54":"Allāh is the one who created you from weakness, then made after weaknes /* Build question bank */
const QS = [];
/* Auto-detect other common rules inside a highlight so quiz options are never ambiguous */
function detect(h){
  const a=[];
  if(/\u0670|\u064E[\u0627\u0649](?!\u0653)|\u064F\u0648(?![\u064B-\u0652])|\u0650[\u064A\u0649](?![\u064B-\u0652])/.test(h)) a.push("tabii");
  if(/[\u0646\u0645][\u064B-\u0650]?\u0651/.test(h)) a.push("ghunnah");
  if(/\u0671\u0644\u0652/.test(h)) a.push("lamQ");
  if(/\u0671\u0644[^\u0652\s]/.test(h)) a.push("lamS");
  if(/[\u0642\u0637\u0628\u062C\u062F]\u0652/.test(h)) a.push("qalS");
  if(/\u0645\u0652\s*[^\u0645\u0628\s]/.test(h)) a.push("izharS");
  return a;
}
const NOFIND=new Set(["tabii","ghunnah","lamQ","lamS","qalS","qalK","arid","leen"]);

/* phrases at verse-end also carry stop rules */

function makeFind(q,allowed){
  const pool=shuffle(QS.filter(o=>(!allowed||allowed.has(o.rule))&&o.rule!==q.rule&&!o.also.includes(q.rule)&&!q.also.includes(o.rule)&&o.hl!==q.hl));
  const seen=new Set([q.hl]),out=[];
  for(const o of pool){if(out.length===3)break;if(seen.has(o.hl))continue;seen.add(o.hl);out.push(o.id)}
  return shuffle([q.id,...out]);
}
function build(q,allowed=null,allowFind=true){
  let type=allowFind&&!NOFIND.has(q.rule)&&Math.random()<.4?"find":"rule";
  let opts=type==="find"?makeFind(q,allowed):makeOptions(q,allowed);
  if(type==="find"&&opts.length<3){type="rule";opts=makeOptions(q,allowed)}
  return {q,type,opts,hint:false};
}
const isRight=(B,p)=>B.type==="find"?p===B.q.id:p===B.q.rule;
function makeOptions(q,allowed){
  const ok=r=>!allowed||allowed.has(r.id);
  const excl=new Set([q.rule,...q.also]);
  const same=shuffle(RULES.filter(r=>ok(r)&&r.cat===q.cat&&!excl.has(r.id))).slice(0,2);
  same.forEach(r=>excl.add(r.id));
  const others=shuffle(RULES.filter(r=>ok(r)&&!excl.has(r.id))).slice(0,3-same.length);
  return shuffle([q.rule,...same.map(r=>r.id),...others.map(r=>r.id)]);
}

function memDeal(){

/* Question renderer shared by practice & review */
function questionBlock(B,{showFeedback,picked,topHTML=""}){
  const q=B.q,c=CMAP[q.cat],done=showFeedback&&picked!=null;
  const head = B.type==="find"
    ? `<div class="qtext">${t("q_find")}</div><div class="qrule" style="--c:${c.color}">${esc(rname(RMAP[q.rule]))} · ${esc(rsub(RMAP[q.rule]))}</div><div style="height:14px"></div>`
    : `${ayahHTML(q.key,q.hl,c.color)}${refHTML(q.key)}<div class="qtext">${t("q_which")}</div>`;
  const opts=B.opts.map(id=>{
    let cls="";const right=B.type==="find"?id===q.id:id===q.rule;
    if(done){ if(right)cls="right"; else if(id===picked)cls="wrong"; } else if(id===picked) cls="picked";
    let inner;
    if(B.type==="find"){const o=QS.find(x=>x.id===id);inner=`<span>${esc(o.hl)}</span><small>${done?esc(rname(RMAP[o.rule])):""}</small>`}
    else {const r=RMAP[id];inner=`<span>${esc(rname(r))}</span><small>${esc(rsub(r))}</small>`}
    return `<button class="opt ${B.type==="find"?"phrase":""} ${cls}" data-opt="${id}" ${done?"disabled":""}>${inner}</button>`}).join("");
  const hintBox = !done ? (B.hint
     ? `<div class="fb" style="background:var(--gold-soft);margin:0 0 14px;white-space:pre-line"><b>💡 ${t("hint_title")}</b>${gl(HINT[q.cat][lang])}${B.type==="find"?`<div style="margin-top:6px">🔎 ${gl(EASY[q.rule][lang==="ar"?3:1])}</div>`:""}</div>`
     : `<div style="margin:-4px 0 12px"><button class="chip" data-hint="1">💡 ${t("hint")}</button></div>`) : "";
  return `<div class="card qbox">${topHTML}${head}${hintBox}<div class="opts">${opts}</div>
    ${done?feedback(B,isRight(B,picked)):""}</div>`;
}
function bindHint(B,rerender){const h=app.querySelector('[data-hint]');if(h)h.onclick=()=>{B.hint=true;rerender()}}
function feedback(B,ok){
  const q=B.q,r=RMAP[q.rule],c=CMAP[q.cat];
  const ctx=B.type==="find"?`<div style="margin:6px 0">${ayahHTML(q.key,q.hl,c.color)}${refHTML(q.key)}</div>`:"";
  const head=ok?"✨ "+t("nice")+" +10 ⭐":t("incorrect")+" "+t("answer_is")+": "+(B.type==="find"?esc(q.hl):esc(rname(r)));
  return `<div class="fb ${ok?"ok":"no"}"><b>${head}</b>${ctx}${gl(lang==="ar"?q.nar:q.nen)}<div style="margin-top:6px">👉 ${gl(EASY[r.id][lang==="ar"?2:0])}</div></div>`;
}

let X=null, timer=null;
function test(){
  clearInterval(timer);
  if(!X){
    const al=learnedRules();
    if(!al.size){app.innerHTML=`<h1>${t("test_title")}</h1><p class="lead">${t("test_lead")}</p>`+gateHTML(t("gate_test"));
      document.getElementById("anyway").remove();return;}
    app.innerHTML=`<h1>${t("test_title")}</h1><p class="lead">${t("test_lead")} ${t("learned_only")}</p><button class="btn" id="go">${t("test_start")}</button>`;
    document.getElementById("go").onclick=()=>{
      let base=QS.filter(q=>al.has(q.rule)),qs=shuffle(base);while(qs.length<10)qs=qs.concat(shuffle(base));qs=qs.slice(0,10);
      X={qs,Bs:qs.map(q=>build(q,al)),ans:Array(10).fill(null),i:0,start:Date.now(),done:false};test();
    };return;
  }
  if(X.done) return testResult();
  const q=X.qs[X.i];
  const el=()=>{const s=Math.floor((Date.now()-X.start)/1000);return num(Math.floor(s/60))+":"+num(String(s%60).padStart(2,"0"))};
  app.innerHTML=`<h1>${t("test_title")}</h1>
  <div class="progress"><i style="width:${(X.i)/10*100}%"></i></div>
  ${questionBlock(X.Bs[X.i],{showFeedback:false,picked:X.ans[X.i],topHTML:`<div class="qtop"><span>${t("q_of",{a:num(X.i+1),b:num(10)})}</span></div>`})}
  <div class="row">${X.i>0?`<button class="btn ghost" id="pv">${lang==="ar"?"→":"←"}</button>`:""}
  <button class="btn" id="nx" ${X.ans[X.i]==null?"disabled":""}>${X.i===9?t("finish"):t("next")}</button></div>`;
  timer=setInterval(()=>{const c=document.getElementById("clk");if(c)c.textContent=el()},1000);
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{X.ans[X.i]=b.dataset.opt;test()});
  bindHint(X.Bs[X.i],test);
  const pv=document.getElementById("pv"); if(pv)pv.onclick=()=>{X.i--;test()};
  document.getElementById("nx").onclick=()=>{
    if(X.i<9){X.i++;test();return}
