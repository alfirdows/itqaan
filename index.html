    let sc=0;X.qs.forEach((q,i)=>{const ok=isRight(X.Bs[i],X.ans[i]);if(ok)sc++;record(q,ok,"test")});
    X.score=sc; logHist("test","test",sc,10); if(stats.best==null||sc>stats.best){stats.best=sc;saveStats()} test();
  };
}

/* ---------- Big word with letter clusters ---------- */
const MARKRE=/[ً-ٰٟۖ-ۭـ]/;
function clusters(w){const out=[];for(const ch of w){if(MARKRE.test(ch)&&out.length)out[out.length-1]+=ch;else out.push(ch)}return out}
function bigWord(r,mode,state={}){
  const v=VIS[r.id],e=r.ex[v.t[0]],cls=clusters(e[1]);
  return `<div class="bigword ${mode==="tap"?"tap":""}" style="--c:${CMAP[r.cat].color}">${cls.map((c,i)=>{
    if(c===" ")return " ";
    let k="cl";
    if(mode==="see"){if(i===v.t[1])k+=" tg";if(i===v.t[2])k+=" src"}
    else{if(state.hintSrc&&i===v.t[2])k+=" src";if(state.good&&i===v.t[1])k+=" good";if(state.bad===i)k+=" bad"}
    return `<span class="${k}" data-ci="${i}">${esc(c)}</span>`}).join("")}</div>`;
}
function chipTxt(x){return x==null?"":Array.isArray(x)?`<span class="fx txt">${esc(x[lang==="ar"?1:0])}</span>`:`<span class="fx" dir="rtl">${esc(x)}</span>`}
function formulaHTML(r){const v=VIS[r.id];
  return `<div class="formula" style="--c:${CMAP[r.cat].color}">${chipTxt(v.a).replace('class="fx','class="fx src')}${v.b!=null?`<span class="op">+</span>${chipTxt(v.b)}`:""}<span class="op">=</span><span class="res">${bidi(esc(v.r[lang==="ar"?1:0]))}</span></div>`}
function tapQ(r){const k=TAPQ[r.cat]?r.cat:r.id;return (TAPQ[r.id]||TAPQ[r.cat])[lang==="ar"?1:0]}

function startLesson(id){
  let steps;
  if(id==="found") steps=FOUND.map(f=>({kind:"found",f}));
  else if(CONCEPT[id]) steps=CONCEPT[id].steps.map(x=>({kind:"concept",x}));
  else steps=[{kind:"intro"},...RULES.filter(r=>r.cat===id).flatMap(r=>[{kind:"see",r},{kind:"tap",r,st:{}}])];
  let quiz;
  if(id==="exam"){const rq=shuffle(QS).slice(0,6).map(q=>({kind:"q",B:build(q,null,false),picked:null}));const cq=shuffle(Object.keys(CONCEPT).filter(k=>k!=="exam").flatMap(k=>CONCEPT[k].quiz)).slice(0,6).map(x=>({kind:"cq",x,order:shuffle(x.opts.map((_,i)=>i)),picked:null}));quiz=shuffle(rq.concat(cq))}
  else if(CONCEPT[id]) quiz=shuffle(CONCEPT[id].quiz).slice(0,4).map(x=>({kind:"cq",x,order:shuffle(x.opts.map((_,i)=>i)),picked:null}));
  else if(id==="found") quiz=shuffle(MARKS).slice(0,4).map(m=>({kind:"mark",m,opts:shuffle([m.k,...shuffle(Object.keys(MARKN).filter(k=>k!==m.k)).slice(0,3)]),picked:null}));
  else{
    const allowed=new Set([...learnedRules(),...RULES.filter(r=>r.cat===id).map(r=>r.id)]);
    const rs=RULES.filter(r=>r.cat===id);
    let qs=[];rs.forEach(r=>{qs.push(shuffle(QS.filter(q=>q.rule===r.id))[0])});
    qs=shuffle(qs.concat(shuffle(QS.filter(q=>q.cat===id&&!qs.includes(q))).slice(0,Math.max(0,6-qs.length)))).slice(0,4);
    quiz=qs.map(q=>({kind:"q",B:build(q,allowed,false),picked:null}));
  }
  const withBreaks=[];steps.forEach((x,i)=>{withBreaks.push(x);if((i+1)%4===0&&i<steps.length-1)withBreaks.push({kind:"break"})});
  LS={id,steps:withBreaks,step:0,quiz,qi:-1,score:0};
  lessonRun();
}

    else if(st.kind==="tap"){const r=st.r;
      body=`<article class="card pad" style="--c:${CMAP[id].color}"><div class="rulelabel">${esc(rname(r))}</div><div class="prompt">👆 ${gl(tapQ(r))}</div>${bigWord(r,"tap",st.st)}

  } else {
    const item=LS.quiz[LS.qi],head=`<div class="qtop"><span>${t("quiz")} · ${num(LS.qi+1)}/${num(LS.quiz.length)}</span></div>`;

    } else if(item.kind==="mark"){

      body=`<div class="card qbox">${head}<div class="qtext">${t("q_mark")}</div><div class="ayah" style="text-align:center;font-size:64px;line-height:1.6;color:var(--gold)">${item.m.d}</div>
      <div class="opts">${item.opts.map(k=>{let cls="";if(done){if(k===item.m.k)cls="right";else if(k===item.picked)cls="wrong"}
        return `<button class="opt ${cls}" data-mk="${k}" ${done?"disabled":""}><span>${MARKN[k][lang==="ar"?0:1]}</span><small>${MARKN[k][lang==="ar"?1:0]}</small></button>`}).join("")}</div>
      ${done?`<div class="fb ${item.picked===item.m.k?"ok":"no"}"><b>${item.picked===item.m.k?t("correct"):t("incorrect")+" "+t("answer_is")+": "+MARKN[item.m.k][lang==="ar"?0:1]}</b></div>`:""}</div>`;
    } else body=questionBlock(item.B,{showFeedback:true,picked:item.picked,topHTML:head});
    nav=item.picked!=null?`<div class="row"><button class="btn" id="lnx">${t("next")}</button></div>`:"";
  }
  app.innerHTML=top+body+nav+(LS.qi===-1&&LS.steps[LS.step]&&LS.steps[LS.step].kind!=="break"?swipeBar():"");
  app.querySelectorAll("[data-arw]").forEach(x=>x.onclick=()=>{const b=document.getElementById(x.dataset.arw==="next"?"lnx":"lprev");if(b&&!b.disabled){if(x.dataset.arw==="prev")flipDir=-1;b.click()}});
  const g=x=>document.getElementById(x);
  if(g("lback"))g("lback").onclick=()=>{LS=null};
  if(g("lstop"))g("lstop").onclick=()=>{LS.step++;store.set("resume",{id:LS.id,step:LS.step});LS=null};
  if(g("lprev"))g("lprev").onclick=()=>{LS.step--;lessonRun();scrollTo(0,0)};
  if(g("lredo"))g("lredo").onclick=()=>startLesson(id);
  if(g("lnext"))g("lnext").onclick=()=>startLesson(LESSONS[LESSONS.indexOf(id)+1]);
  if(g("lnx"))g("lnx").onclick=()=>{
    if(LS.qi<0){ if(LS.step<LS.steps.length-1)LS.step++; else LS.qi=0; }
    else { if(LS.qi<LS.quiz.length-1)LS.qi++; else { LS.qi=-2; logHist("lesson",id,LS.score,LS.quiz.length); if(!doneL.includes(id)){doneL.push(id);saveDone()} P.q=null; addStars(50); setTimeout(confetti,50); } }
    lessonRun();scrollTo(0,0);
  };
  if(LS.qi<0&&LS.steps[LS.step].kind==="tap"){const st=LS.steps[LS.step],v=VIS[st.r.id];
    app.querySelectorAll(".bigword.tap .cl").forEach(sp=>sp.onclick=()=>{if(st.st.good)return;const i=+sp.dataset.ci;
      if(i===v.t[1]){st.st={good:true,msg:"✨ "+t("nice")+" +10 ⭐"};addStars(10)}
      else{st.st.tries=(st.st.tries||0)+1;st.st.bad=i;st.st.hintSrc=v.t[2]!=null;st.st.msg=v.t[2]!=null?t("tryagain"):t("tryagain2");if(st.st.tries>=3){st.st.good=true;st.st.msg="👉 "+t("got_it")}}
      lessonRun()});}
  app.querySelectorAll("[data-cq]").forEach(b=>b.onclick=()=>{const it=LS.quiz[LS.qi];if(it.picked!=null)return;it.picked=+b.dataset.cq;if(it.picked===0){LS.score++;addStars(10)}lessonRun()});
  app.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{const it=LS.quiz[LS.qi];if(it.picked!=null)return;it.picked=b.dataset.mk;if(it.picked===it.m.k){LS.score++;addStars(10)}lessonRun()});
  if(LS.qi>=0){const it=LS.quiz[LS.qi];if(it.kind==="q"){
    bindHint(it.B,lessonRun);
    app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{if(it.picked!=null)return;it.picked=b.dataset.opt;const ok=isRight(it.B,it.picked);if(ok)LS.score++;record(it.B.q,ok,"lesson");lessonRun()});
  }}
}

let R={q:null,B:null,picked:null};
function review(){
  const ids=Object.keys(mistakes).filter(id=>QS.some(q=>q.id===id));
  let head=`<h1>${t("review_title")}</h1><p class="lead">${t("review_lead")}</p>`;
  if(!ids.length && !R.q){
    app.innerHTML=head+`<div class="card empty"><div class="big">${stats.answered?"🌿":"📭"}</div><p>${stats.answered?t("review_done"):t("review_empty")}</p><a class="btn" href="#practice" style="text-decoration:none;display:inline-block;margin-top:8px">${t("go_practice")}</a></div>`;
    return;
  }
  if(!R.q){const id=ids[Math.random()*ids.length|0];R.q=QS.find(q=>q.id===id);R.B=build(R.q,learnedRules().size?new Set([...learnedRules(),R.q.rule]):null);R.picked=null}
  const need=mistakes[R.q.id];
  app.innerHTML=head+questionBlock(R.B,{showFeedback:true,picked:R.picked,topHTML:`<div class="qtop"><span>${t("review_left",{n:num(ids.length)})}</span><span>${need?t("remaining",{n:num(need)}):"✓"}</span></div>`})+
   `<div class="row"><button class="btn ghost" id="clr">${t("review_clear")}</button>${R.picked!=null?`<button class="btn" id="nx">${t("next")}</button>`:""}</div>`;
  bindHint(R.B,review);
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{if(R.picked!=null)return;R.picked=b.dataset.opt;record(R.q,isRight(R.B,R.picked),"review");review()});
  document.getElementById("clr").onclick=()=>{mistakes={};saveMist();R.q=null;review()};
  const nx=document.getElementById("nx"); if(nx){nx.onclick=()=>{R.q=null;review()};nx.focus()}
}

/* ---------- Audio: tap 🔊 to hear the verse (Sheikh Ibrahim Al-Akhdar, EveryAyah) ---------- */
let AU=null,AUkey=null;
function playBtns(){document.querySelectorAll("[data-play]").forEach(b=>{const on=AU&&!AU.paused&&b.dataset.play===AUkey;b.classList.toggle("on",on);b.innerHTML=(on?"⏸ ":"🔊 ")+t(on?"stop_audio":"listen")})}
function play(key){
  if(AU&&AUkey===key&&!AU.paused){AU.pause();playBtns();return}
  if(AU)AU.pause();
  const urls=[audioURL(key),audioURL(key).replace("_32kbps","_64kbps")];let i=0;
  AU=new Audio();AUkey=key;AU.preload="auto";
  const tryNext=()=>{if(i>=urls.length){window.open(urls[0],"_blank");return}AU.src=urls[i++];const pr=AU.play();if(pr&&pr.catch)pr.catch(err=>{if(err&&err.name==="NotAllowedError"){window.open(urls[0],"_blank")}})};
  AU.onerror=tryNext;AU.onplay=AU.onpause=AU.onended=playBtns;tryNext();playBtns();
}
const wbwURL=(key,w)=>{const [s,a]=key.split(":");return `https://audio.qurancdn.com/wbw/${String(s).padStart(3,"0")}_${String(a).padStart(3,"0")}_${String(w).padStart(3,"0")}.mp3`};
function verseWords(key){let n=0;return V[key].split(/\s+/).map(w=>{const isW=/[ء-غف-يٱ-ۓ]/.test(w);return {w,i:isW?++n:0}})}
function playWord(key,i,btn){if(AU)AU.pause();AU=new Audio(wbwURL(key,i));AUkey="w";document.querySelectorAll(".vw.on").forEach(x=>x.classList.remove("on"));if(btn)btn.classList.add("on");
  AU.onended=AU.onpause=()=>{if(btn)btn.classList.remove("on")};AU.onerror=()=>{if(btn)btn.classList.remove("on");play(key)};const pr=AU.play();if(pr&&pr.catch)pr.catch(()=>{})}
/* read-aloud for explanations only (never for Quran verses) */
function sayCard(btn){const S=window.speechSynthesis;if(!S){btn.disabled=true;return}
  if(S.speaking){S.cancel();btn.classList.remove("on");return}
  const card=btn.closest(".card,article,#popc")||app;const c=card.cloneNode(true);
  c.querySelectorAll(".ayah,.bigword,.demo,.lead-ar,.lc,.gword,.ref,button,.letters,.formula,.pic svg,.ovt,.mw,.vwords,details:not([open])").forEach(x=>x.remove());
  const txt=c.innerText.replace(/[ⓘ👉🔎💡📖💬🔊]/g," ").replace(/\s+/g," ").trim();if(!txt)return;
  const u=new SpeechSynthesisUtterance(txt);u.lang=lang==="ar"?"ar-SA":"en-US";u.rate=.92;
  const v=S.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang==="ar"?"ar":"en"));if(v)u.voice=v;
  u.onend=u.onerror=()=>btn.classList.remove("on");btn.classList.add("on");S.speak(u)}
document.addEventListener("click",e=>{const s=e.target.closest("[data-say]");if(s){e.preventDefault();e.stopPropagation();sayCard(s);return}
  const w=e.target.closest("[data-vw]");if(w){e.preventDefault();e.stopPropagation();const [k,i]=w.dataset.vw.split("|");playWord(k,+i,w);return}},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(b){e.preventDefault();e.stopPropagation();play(b.dataset.play)}},true);

/* Recitation: the phone's own speech recognition checks words; MediaRecorder lets you compare with the sheikh */
function normAr(s){return s.replace(/ٰ/g,"ا").replace(/[ؐ-ًؚ-ٟۖ-ۭـء]/g,"")
  .replace(/[ٱآأإ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
  .replace(/[^ء-ي]/g,"")}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const simAr=(a,b)=>{const f=(x,y)=>1-lev(x,y)/Math.max(x.length,y.length,1),na=s=>s.replace(/ا/g,"");return Math.max(f(a,b),f(na(a),na(b)))};
function matchWords(key,said){
  const vw=V[key].split(/\s+/).map(w=>({w,n:normAr(w)})).filter(x=>x.n);
  const sw=said.split(/\s+/).map(normAr).filter(Boolean);let j=0;
  vw.forEach(x=>{for(let k=j;k<Math.min(sw.length,j+4);k++){if(simAr(x.n,sw[k])>=.65){x.ok=true;j=k+1;break}}});
  return vw;
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let RC=null;
function rcStop(){if(!RC)return;try{RC.sr&&RC.sr.abort()}catch(e){}try{RC.mr&&RC.mr.state!=="inactive"&&RC.mr.stop()}catch(e){}
  if(RC.stream)RC.stream.getTracks().forEach(x=>x.stop());RC.sr=null}
const _closePop=closePop;closePop=function(){rcStop();_closePop()};
function rcOpen(key){rcStop();RC={key,state:"idle",heard:"",res:null,you:null,rec:false};rcDraw()}
function rcDraw(){

  const words=RC.res?RC.res.map(x=>`<span class="rw ${x.ok?"ok":"no"}">${esc(x.w)}</span>`).join(" "):esc(V[key]);

  openPop(`<h3>🎤 ${t("rc_title")} · ${esc(SURAH[s][lang==="ar"?0:1])} ${num(s)}:${num(a)}</h3>
    <p class="note" style="margin-top:0">${t("rc_lead")}</p>
    <div class="ayah rcv">${words}</div>
    ${RC.state==="listen"?`<div class="note rclive">${t("rc_listening")}<div dir="rtl">${esc(RC.heard)}</div></div>`:""}
    ${res}${RC.err?`<div class="fb no">${RC.err}</div>`:""}
    <div class="row" style="justify-content:flex-start;margin-top:14px">
      ${SR?(RC.state==="listen"?`<button class="btn" id="rcGo">${t("rc_stop")}</button>`:`<button class="btn" id="rcGo">${RC.res?t("rc_again"):t("rc_start")}</button>`):`<div class="note">${t("rc_nosr")}</div>`}
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">

function rcListen(){
  const sr=new SR();sr.lang="ar-SA";sr.continuous=true;sr.interimResults=true;
  let fin="";RC.sr=sr;RC.state="listen";RC.heard="";RC.res=null;RC.err=null;rcDraw();
  sr.onresult=e=>{let live="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=" "+e.results[i][0].transcript;else live+=" "+e.results[i][0].transcript}
    RC.heard=(fin+live).trim();const el=document.querySelector(".rclive div");if(el)el.textContent=RC.heard};
  sr.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")RC.err=t("rc_mic")};
  sr.onend=()=>{if(!RC||RC.sr!==sr)return;RC.sr=null;RC.state="idle";const said=(RC.heard||fin).trim();
    if(!RC.err){RC.res=matchWords(RC.key,said);const ok=RC.res.filter(x=>x.ok).length;if(ok){logHist("recite",RC.key,ok,RC.res.length);if(ok===RC.res.length)addStars(10)}}

async function rcRecord(){
  const me=RC;

  mr.onstop=()=>{me.stream.getTracks().forEach(x=>x.stop());me.rec=false;if(me.you)URL.revokeObjectURL(me.you);
    me.you=URL.createObjectURL(new Blob(parts,{type:mr.mimeType||"audio/webm"}));if(RC===me&&pop.classList.contains("on"))rcDraw()};
  mr.start();me.rec=true;me.err=null;rcDraw();setTimeout(()=>{if(mr.state==="recording")mr.stop()},90000);
}

/* Merge two saves so nothing is lost: stars/days take the max, lessons and history are combined */
function mergeData(a,b){
  const J=(o,k,d)=>{try{return o[k]!=null?JSON.parse(o[k]):d}catch(e){return d}},out={...b,...a};
  const ga=J(a,"itqan:game",null),gb=J(b,"itqan:game",null);
  if(ga&&gb)out["itqan:game"]=JSON.stringify({...gb,...ga,stars:Math.max(ga.stars||0,gb.stars||0),days:Math.max(ga.days||0,gb.days||0),last:[ga.last,gb.last].filter(Boolean).sort().pop()||null});
  const da=J(a,"itqan:done",[]),db=J(b,"itqan:done",[]);out["itqan:done"]=JSON.stringify([...new Set([...db,...da])]);
  const ha=J(a,"itqan:hist",[]),hb=J(b,"itqan:hist",[]),seen=new Set();
  out["itqan:hist"]=JSON.stringify([...hb,...ha].filter(h=>{const k=h.d+h.k+h.id;if(seen.has(k))return false;seen.add(k);return true}).sort((x,y)=>x.d-y.d).slice(-300));
  const sa=J(a,"itqan:stats",null),sb=J(b,"itqan:stats",null);
  if(sa&&sb){const m=(sa.answered||0)>=(sb.answered||0)?sa:sb;out["itqan:stats"]=JSON.stringify({...m,best:Math.max(sa.best??-1,sb.best??-1)<0?null:Math.max(sa.best??-1,sb.best??-1)})}
  return out;
}

document.getElementById("zUp").onclick=()=>{ZOOM=Math.min(1.5,Math.round((ZOOM+.1)*10)/10);store.set("zoom",ZOOM);applyZoom()};
document.getElementById("zDn").onclick=()=>{ZOOM=Math.max(.9,Math.round((ZOOM-.1)*10)/10);store.set("zoom",ZOOM);applyZoom()};applyZoom();

document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("#lprev"))flipDir=-1},true);
/* Swipe like a book in lessons: next page = swipe toward the reading direction */
(()=>{let x0=null,y0=null,t0=0;
 app.addEventListener("touchstart",e=>{if(!LS||!document.getElementById("lnx")&&!document.getElementById("lprev"))return;const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});
 app.addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-t0>800)return;
  const rtl=document.documentElement.dir==="rtl";const next=rtl?dx>0:dx<0;
  const b=document.getElementById(next?"lnx":"lprev");if(b&&!b.disabled){flipDir=next?1:-1;b.click()}},{passive:true});
})();
new MutationObserver(()=>{const has=!!app.querySelector(".term:not([data-v])");app.querySelectorAll(".tip").forEach(t=>t.hidden=!has)}).observe(app,{childList:true,subtree:true});
applyLang(); renderPill(); route(); acInit();
</script>
</body>
