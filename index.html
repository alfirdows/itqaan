<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itqaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ec; --surface:#fffdf8; --ink:#1d2a26; --muted:#5f6d68; --line:#e4ddcc;
  --brand:#0f5c4d; --brand-2:#14806b; --gold:#b8892b; --gold-soft:#f3e7c8;
  --ok:#1f8a4c; --ok-soft:#e1f3e8; --bad:#b83a3a; --bad-soft:#f8e3e1;
  --c-noon:#1d6fb8; --c-meem:#8a4fbf; --c-gq:#c0612b; --c-lam:#2f8f5b; --c-madd:#b8336a;
  --radius:16px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1513;--surface:#17201d;--ink:#e9efe9;--muted:#9aa9a3;--line:#26332e;
  --brand:#3fbf9f;--brand-2:#56d3b3;--gold:#d9ad4f;--gold-soft:#2b2618;--ok:#4cc27e;--ok-soft:#173022;--bad:#e57373;--bad-soft:#3a1d1d;
  --c-noon:#5aa6ea;--c-meem:#b48ae0;--c-gq:#e8915c;--c-lam:#5cc58c;--c-madd:#e46c9c;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-family:"Amiri Quran",serif;font-size:20px;line-height:1}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:-2px}
nav{display:flex;gap:4px;margin-inline-start:auto}
nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
nav a:hover{background:var(--line);color:var(--ink)}
nav a.active{background:var(--brand);color:#fff}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.lang:hover{border-color:var(--brand)}
main{padding:28px 0 80px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
h2{font-size:22px;margin:0 0 8px}
h3{font-size:17px;margin:0 0 6px}
p.lead{font-size:18px;color:var(--muted);max-width:640px;margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;margin-bottom:28px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-verse{padding:28px;text-align:center;background:linear-gradient(160deg,var(--brand),#0b3f35);color:#fff;border:none}
.hero-verse .q{font-family:"Amiri Quran",serif;font-size:30px;line-height:2.1;direction:rtl}
.hero-verse .t{opacity:.85;font-size:14px;margin-top:6px}
.tile{display:block;text-decoration:none;color:inherit;padding:20px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font-size:20px;margin-bottom:12px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 0}
.stat{flex:1;min-width:140px;padding:16px 18px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.cat-head{display:flex;align-items:center;gap:10px;margin:32px 0 12px}
.cat-head .dot{width:12px;height:12px}
.rule{padding:20px;border-inline-start:4px solid var(--c)}
.rule .tr{color:var(--muted);font-size:13px;font-style:italic;margin-bottom:8px}
.rule p{margin:0 0 10px;font-size:15px}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;direction:rtl}
.letters span{font-family:"Amiri Quran",serif;font-size:22px;min-width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);padding:0 6px}
.ex{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.ayah{font-family:"Amiri Quran",serif;direction:rtl;text-align:right;font-size:26px;line-height:2.2}
.ayah mark{background:color-mix(in srgb,var(--c,var(--gold)) 22%,transparent);color:inherit;border-radius:6px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--c,var(--gold))}
.ref{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ref a{text-decoration:none}
.note{font-size:14px;color:var(--muted)}
.btn{border:none;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;font-weight:600}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.qbox{padding:26px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.qtext{font-weight:600;margin:14px 0 12px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt small{color:var(--muted);font-size:12px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.picked{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.score{font-size:56px;font-weight:700;color:var(--brand);line-height:1}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px}
.result-item{padding:14px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.lrow{display:flex;align-items:center;gap:16px;padding:16px 18px;border-inline-start:4px solid var(--c);flex-wrap:wrap}
.lnum{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.found{padding:20px;border-inline-start:4px solid var(--gold)}
.found p{white-space:pre-line;font-size:18px!important;font-weight:500}
.found .demo{font-family:"Amiri Quran",serif;font-size:34px;direction:rtl;letter-spacing:6px;margin:6px 0 4px;color:var(--gold)}
.step{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:36px 0 -6px}
.cat-head .btn{margin-inline-start:auto;padding:8px 14px;font-size:14px;text-decoration:none}
.opt.phrase span{font-family:"Amiri Quran",serif;font-size:24px;direction:rtl;line-height:1.9}
.qrule{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:99px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.term{all:unset;cursor:pointer;border-bottom:2px dotted var(--brand);color:inherit}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--brand) 12%,transparent);border-radius:4px}
.big1{font-size:19px;font-weight:600;margin:8px 0 4px;line-height:1.5}
.when1{font-size:15px;color:var(--muted);margin:0 0 8px}
.kid{font-size:17px;line-height:1.6;margin:6px 0 12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft)}
.easy{display:grid;gap:6px;margin:4px 0 12px;font-size:16px}
.easy div{background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:10px;padding:8px 12px}
details.more summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:14px;margin:4px 0}
details.more p{margin:6px 0 0}
.ayah[data-key]{cursor:pointer}
.ayah[data-key]:hover{opacity:.85}
#pop{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
#pop.on{display:flex}
#pop .sheet{background:var(--surface);border-radius:20px 20px 0 0;max-width:640px;width:100%;padding:22px 22px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:80vh;overflow:auto}
@media (min-width:700px){#pop{align-items:center}#pop .sheet{border-radius:20px}}
#pop h3{font-size:20px;margin:0 0 8px}
#pop .simple{font-size:18px;line-height:1.6}
#pop .x{float:inline-end;border:none;background:var(--line);border-radius:99px;width:34px;height:34px;font-size:18px}
.tip{font-size:13px;color:var(--muted);margin:0 0 14px}
.bigword{font-family:"Amiri Quran",serif;direction:rtl;text-align:center;font-size:clamp(52px,12vw,84px);line-height:1.9;margin:6px 0}
.bigword .cl{cursor:default;transition:color .2s}
.bigword.tap .cl{cursor:pointer}
.bigword.tap .cl:hover{color:var(--brand)}
.cl.tg{color:var(--c)}
.cl.src{color:var(--gold)}
.cl.good{color:var(--ok)}
.cl.bad{color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:10px 0 18px}
.formula .fx{font-family:"Amiri Quran",serif;font-size:26px;padding:4px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,transparent);border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.formula .fx.src{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.formula .fx.txt{font-family:inherit;font-size:16px;font-weight:600}
.formula .op{font-size:26px;font-weight:700;color:var(--muted)}
.formula .res{font-size:18px;font-weight:700;padding:8px 16px;border-radius:14px;background:var(--c);color:#fff}
.center{text-align:center}
.rulelabel{text-align:center;font-weight:700;color:var(--c);letter-spacing:.02em}
.prompt{text-align:center;font-size:20px;font-weight:600;margin:4px 0 0}
.win{text-align:center;font-size:20px;font-weight:700;color:var(--ok);min-height:30px}
.pill{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-40px;font-style:normal;font-size:26px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@keyframes pop{from{transform:scale(.98);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.level{margin:0 0 12px}
.level>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:17px}
.level>summary::-webkit-details-marker{display:none}
.level[open]>summary{border-color:var(--brand)}
.lvicon{font-size:26px}
.lvbar{height:6px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--brand)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
@media (max-width:640px){
  .pill{order:2}
  .bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  nav{order:3;width:100%;margin:0;overflow-x:auto}
  nav a{white-space:nowrap}
  .lang{margin-inline-start:auto}
  .ayah{font-size:23px}
}
</style>
</head>

ah: أَبْ. Where the sound stops is its spot.", "ar": "سكّن الحرف وقبله همزة: أَبْ. حيث ينقطع الصوت فهو مخرجه."}], "quiz": [{"qen": "Where does ب come from?", "qar": "من أين تخرج الباء؟", "opts": [["the lips", "الشفتان"], ["the throat", "الحلق"], ["the nose", "الخيشوم"]], "wen": "Close your lips and say أَبْ.", "war": "أطبق شفتيك وقل أَبْ."}, {"qen": "Where does the ghunnah come from?", "qar": "من أين تخرج الغنة؟", "opts": [["the nose", "الخيشوم"], ["the lips", "الشفتان"], ["the tongue", "اللسان"]], "wen": "Hold your nose and the hum stops.", "war": "أمسك أنفك فتنقطع الغنة."}, {"qen": "Which letter is from the throat?", "qar": "أي حرف من الحلق؟", "opts": [["ع", "ع"], ["ب", "ب"], ["ق", "ق"]], "wen": "ع is in the middle of the throat.", "war": "العين من وسط الحلق."}, {"qen": "Long vowels ا و ي come from…", "qar": "حروف المد ا و ي تخرج من…", "opts": [["the open space (al-jawf)", "الجوف"], ["the lips", "الشفتين"], ["the nose", "الخيشوم"]], "wen": "They come from the open space.", "war": "تخرج من الجوف."}, {"qen": "Which letter is from the tongue?", "qar": "أي حرف من اللسان؟", "opts": [["ق", "ق"], ["ء", "ء"], ["م", "م"]], "wen": "ق is from the back of the tongue.", "war": "القاف من أقصى اللسان."}]}, "heavy": {"en": "Heavy & light letters", "ar": "التفخيم والترقيق", "color": "#a0522d", "steps": [{"big": "خ ص ض غ ط ق ظ", "ar_big": true, "ten": "Always heavy", "tar": "حروف مفخّمة دائمًا", "en": "7 letters are always heavy. Remember them as: خُصَّ ضَغْطٍ قِظْ", "ar": "٧ حروف مفخّمة دائمًا، يجمعها: «خُصَّ ضَغْطٍ قِظْ»"}, {"big": "😮 · 🙂", "ar_big": false, "ten": "Heavy vs light", "tar": "المفخّم والمرقّق", "en": "Heavy = full, deep sound, mouth rounded. Light = thin, normal sound. Most letters are light.", "ar": "المفخّم = صوت ممتلئ عميق. المرقّق = صوت رقيق. وأكثر الحروف مرقّقة."}, {"big": "ل · ر · ا", "ar_big": true, "ten": "Letters that change", "tar": "حروف تتغيّر", "en": "3 letters can be heavy or light: ل (in “Allah”), ر, and ا.", "ar": "٣ حروف تُفخّم مرة وتُرقّق مرة: اللام (في لفظ الجلالة)، والراء، والألف."}, {"big": "رَ رُ  ·  رِ", "ar_big": true, "ten": "The letter ر", "tar": "الراء", "en": "رَ or رُ = heavy. رِ = light.", "ar": "الراء المفتوحة أو المضمومة مفخّمة، والمكسورة مرقّقة."}, {"big": "قَالَ · كَانَ", "ar_big": true, "ten": "The letter ا", "tar": "الألف", "en": "Alif copies the letter before it. قَا = heavy. كَا = light.", "ar": "الألف تتبع ما قبلها: «قَا» مفخّمة، «كَا» مرقّقة."}], "quiz": [{"qen": "Which letter is always heavy?", "qar": "أي حرف مفخّم دائمًا؟", "opts": [["ص", "ص"], ["س", "س"], ["ت", "ت"]], "wen": "ص is one of خص ضغط قظ.", "war": "الصاد من «خص ضغط قظ»."}, {"qen": "رِ (with a kasrah) is…", "qar": "الراء المكسورة رِ…", "opts": [["light", "مرقّقة"], ["heavy", "مفخّمة"]], "wen": "Kasrah makes ر light.", "war": "الكسر يرقّق الراء."}, {"qen": "رَ (with a fatḥah) is…", "qar": "الراء المفتوحة رَ…", "opts": [["heavy", "مفخّمة"], ["light", "مرقّقة"]], "wen": "Fatḥah makes ر heavy.", "war": "الفتح يفخّم الراء."}, {"qen": "The alif in قَالَ is…", "qar": "الألف في «قَالَ»…", "opts": [["heavy", "مفخّمة"], ["light", "مرقّقة"]], "wen": "It comes after ق, a heavy letter.", "war": "جاءت بعد القاف وهي مفخّمة."}, {"qen": "Which group is the always-heavy letters?", "qar": "ما المجموعة المفخّمة دائمًا؟", "opts": [["خص ضغط قظ", "خص ضغط قظ"], ["ي ن م و", "ي ن م و"], ["ق ط ب ج د", "ق ط ب ج د"]], "wen": "خص ضغط قظ = 7 heavy letters.", "war": "«خص ضغط قظ» سبعة حروف مفخّمة."}]}, "wasl": {"en": "The silent hamzah ( ٱ )", "ar": "همزة الوصل ( ٱ )", "color": "#4f7cac", "steps": [{"big": "ٱ", "ar_big": true, "ten": "Hamzat al-waṣl", "tar": "همزة الوصل", "en": "This alif with a little head ( ٱ ) is silent when you join it to the word before.", "ar": "الألف التي عليها رأس صاد صغير ( ٱ ) لا تُنطق عند وصلها بما قبلها."}, {"big": "وَٱلْقَمَرِ", "ar_big": true, "ten": "Joining", "tar": "عند الوصل", "en": "Joined: skip it. Say “wal-qamar”, not “wa-al-qamar”.", "ar": "في الوصل تسقط: «وَلْقَمَرِ».", "ref": "91:2"}, {"big": "ٱلْحَمْدُ ← اَلْحَمْدُ", "ar_big": true, "ten": "Starting with ال", "tar": "البدء بـ «ال»", "en": "Starting a word with ٱل? Say it with “a”: al‑ḥamdu.", "ar": "تبدأ بكلمة فيها «ٱل»؟ انطق الهمزة مفتوحة: اَلْحَمْدُ.", "ref": "1:2"}, {"big": "ٱدْعُ ← اُدْعُ", "ar_big": true, "ten": "Verb, 3rd letter has ḍammah", "tar": "فعل ثالثه مضموم", "en": "3rd letter has a ḍammah? Start with “u”: ud‘u.", "ar": "إذا كان ثالث الفعل مضمومًا فابدأ بالضم: اُدْعُ.", "ref": "16:125"}, {"big": "ٱذْهَبْ ← اِذْهَبْ", "ar_big": true, "ten": "Verb, 3rd letter not ḍammah", "tar": "فعل ثالثه غير مضموم", "en": "Otherwise start with “i”: idh-hab. Nouns like ٱبْن and ٱسْم also start with “i”.", "ar": "وإلا فابدأ بالكسر: اِذْهَبْ. وكذلك الأسماء مثل «ٱبْن» و«ٱسْم».", "ref": "20:24"}], "quiz": [{"qen": "How do you start the word ٱلْحَمْدُ?", "qar": "كيف تبدأ بكلمة ٱلْحَمْدُ؟", "opts": [["al-ḥamdu (with “a”)", "اَلْحَمْدُ (بالفتح)"], ["il-ḥamdu", "اِلْحَمْدُ"], ["ul-ḥamdu", "اُلْحَمْدُ"]], "wen": "ٱل always starts with “a”.", "war": "«ٱل» تبدأ بالفتح دائمًا."}, {"qen": "How do you start ٱدْعُ?", "qar": "كيف تبدأ بـ ٱدْعُ؟", "opts": [["ud‘u (with “u”)", "اُدْعُ (بالضم)"], ["id‘u", "اِدْعُ"], ["ad‘u", "اَدْعُ"]], "wen": "The 3rd letter ع has a ḍammah.", "war": "ثالثه العين مضمومة."}, {"qen": "In وَٱلْقَمَرِ, the ٱ is…", "qar": "في «وَٱلْقَمَرِ» الهمزة…", "opts": [["silent", "لا تُنطق"], ["said with “a”", "تُنطق بالفتح"]], "wen": "Joined to و, so it drops.", "war": "وُصلت بالواو فسقطت."}, {"qen": "How do you start ٱذْهَبْ?", "qar": "كيف تبدأ بـ ٱذْهَبْ؟", "opts": [["idh-hab (with “i”)", "اِذْهَبْ (بالكسر)"], ["udh-hab", "اُذْهَبْ"]], "wen": "The 3rd letter ه has a fatḥah, not ḍammah.", "war": "ثالثه الهاء مفتوحة لا مضمومة."}]}, "sifat": {"en": "Letter traits (ṣifāt)", "ar": "صفات الحروف", "color": "#8a6d3b", "steps": [{"big": "😌 · 😤", "ar_big": false, "ten": "What are traits?", "tar": "ما الصفات؟", "en": "Letters have personalities. Two letters from the same spot sound different because of their traits.", "ar": "للحروف صفات كالشخصيات، فيختلف صوت الحرفين وإن خرجا من مكان واحد."}, {"big": "فَحَثَّهُ شَخْصٌ سَكَتَ", "ar_big": true, "ten": "Whisper (hams)", "tar": "الهمس", "en": "With these 10 letters, some breath escapes, like a whisper: ف ح ث ه ش خ ص س ك ت", "ar": "مع هذه الحروف العشرة يجري النَّفَس كالهمس: ف ح ث ه ش خ ص س ك ت"}, {"big": "أَجِدُ قَطٍ بَكَتْ", "ar_big": true, "ten": "Strong stop (shiddah)", "tar": "الشدة", "en": "With these 8 letters, the sound stops completely: أ ج د ق ط ب ك ت", "ar": "مع هذه الحروف الثمانية ينحبس الصوت تمامًا: أ ج د ق ط ب ك ت"}, {"big": "لِنْ عُمَرْ", "ar_big": true, "ten": "In-between (tawassuṭ)", "tar": "التوسط", "en": "These 5 are in between: the sound flows a little: ل ن ع م ر", "ar": "هذه الخمسة بين الشدة والرخاوة: ل ن ع م ر"}, {"big": "خُصَّ ضَغْطٍ قِظْ", "ar_big": true, "ten": "Tongue rises (istiʿlāʾ)", "tar": "الاستعلاء", "en": "The back of the tongue rises. That's why these 7 are heavy.", "ar": "يرتفع أقصى اللسان، ولهذا هذه السبعة مفخّمة."}, {"big": "ص ض ط ظ", "ar_big": true, "ten": "Tongue covers (iṭbāq)", "tar": "الإطباق", "en": "The tongue covers the roof of the mouth. These 4 are the heaviest.", "ar": "ينطبق اللسان على سقف الفم، وهذه الأربعة أقوى الحروف تفخيمًا."}, {"big": "ص ز س", "ar_big": true, "ten": "Whistle (ṣafīr)", "tar": "الصفير", "en": "A small whistle sound, like a bird.", "ar": "صوت صفير خفيف كصوت الطائر."}], "quiz": [{"qen": "Which letter has a whistle?", "qar": "أي حرف فيه صفير؟", "opts": [["س", "س"], ["م", "م"], ["ع", "ع"]], "wen": "ص ز س whistle.", "war": "الصفير في ص ز س."}, {"qen": "Which letter lets breath escape (whisper)?", "qar": "أي حرف فيه همس؟", "opts": [["ه", "ه"], ["ب", "ب"], ["د", "د"]], "wen": "ه is in فحثه شخص سكت.", "war": "الهاء من «فحثه شخص سكت»."}, {"qen": "With which letter does the sound stop completely?", "qar": "مع أي حرف ينحبس الصوت تمامًا؟", "opts": [["ب", "ب"], ["س", "س"], ["ل", "ل"]], "wen": "ب is in أجد قط بكت.", "war": "الباء من «أجد قط بكت»."}, {"qen": "Which letter covers the roof of the mouth?", "qar": "أي حرف فيه إطباق؟", "opts": [["ط", "ط"], ["ت", "ت"], ["ق", "ق"]], "wen": "ص ض ط ظ are the covering letters.", "war": "حروف الإطباق ص ض ط ظ."}]}, "two": {"en": "When two letters meet", "ar": "المثلان والمتجانسان والمتقاربان", "color": "#5b8c5a", "steps": [{"big": "بْ + ب", "ar_big": true, "ten": "The idea", "tar": "الفكرة", "en": "When a letter with sukūn meets the next letter, sometimes they merge into one doubled letter.", "ar": "إذا التقى حرف ساكن بالحرف الذي بعده، فقد يُدغم فيه فيصيران حرفًا مشددًا."}, {"big": "رَبِحَت تِّجَـٰرَتُهُمْ", "ar_big": true, "ten": "Twins (mithlayn)", "tar": "المثلان", "en": "Same letter twice, first has sukūn → always merge. تْ + ت = تّ", "ar": "حرفان متماثلان والأول ساكن ← يُدغم دائمًا: تْ + ت = تّ", "ref": "2:16"}, {"big": "قَد تَّبَيَّنَ", "ar_big": true, "ten": "Cousins (mutajānisayn)", "tar": "المتجانسان", "en": "Same spot, different letters. Merge in a few pairs, like د → ت.", "ar": "مخرج واحد وصفات مختلفة. يُدغم في مواضع معيّنة مثل الدال في التاء.", "ref": "2:256"}, {"big": "بَسَطتَ", "ar_big": true, "ten": "A cousin that keeps its weight", "tar": "إدغام ناقص", "en": "ط merges into ت, but you keep a little of ط's heaviness.", "ar": "تُدغم الطاء في التاء مع بقاء صفة الإطباق.", "ref": "5:28"}, {"big": "ٱرْكَب مَّعَنَا", "ar_big": true, "ten": "Another cousin pair", "tar": "مثال آخر", "en": "بْ meets م → merge into مّ, with a hum.", "ar": "الباء الساكنة قبل الميم ← تُدغم فيها مع غنة.", "ref": "11:42"}, {"big": "وَقُل رَّبِّ", "ar_big": true, "ten": "Neighbours (mutaqāribayn)", "tar": "المتقاربان", "en": "Close spots. لْ meets ر → merge: “wa qur-rabbi”.", "ar": "مخرجان متقاربان: اللام الساكنة قبل الراء ← تُدغم.", "ref": "20:114"}, {"big": "نَخْلُقكُّم", "ar_big": true, "ten": "Another neighbour", "tar": "مثال آخر", "en": "ق merges into ك. Full merge is preferred.", "ar": "تُدغم القاف في الكاف، والإدغام الكامل أولى.", "ref": "77:20"}], "quiz": [{"qen": "Same letter twice, first with sukūn. What happens?", "qar": "حرفان متماثلان والأول ساكن. ما الحكم؟", "opts": [["merge", "إدغام"], ["say both clearly", "إظهار"]], "wen": "Twins always merge.", "war": "المثلان يُدغمان."}, {"qen": "In قَد تَّبَيَّنَ, what merges?", "qar": "في «قَد تَّبَيَّنَ» ما الذي يُدغم؟", "opts": [["د into ت", "الدال في التاء"], ["ت into د", "التاء في الدال"], ["nothing", "لا إدغام"]], "wen": "دْ merges into ت.", "war": "الدال الساكنة تُدغم في التاء."}, {"qen": "In بَسَطتَ, you…", "qar": "في «بَسَطتَ»…", "opts": [["merge but keep some heaviness", "تُدغم مع بقاء الإطباق"], ["say ط fully", "تُظهر الطاء"], ["drop the ت", "تحذف التاء"]], "wen": "It's an incomplete merge.", "war": "إدغام ناقص."}, {"qen": "وَقُل رَّبِّ: what do you do with the ل?", "qar": "«وَقُل رَّبِّ»: ما حكم اللام؟", "opts": [["merge it into ر", "تُدغم في الراء"], ["say it clearly", "تُظهر"]], "wen": "لْ and ر are neighbours, so they merge.", "war": "اللام والراء متقاربان فتُدغم."}]}, "waqf": {"en": "Stopping & starting", "ar": "الوقف والابتداء", "color": "#b5651d", "steps": [{"big": "✋", "ar_big": false, "ten": "Good stopping", "tar": "الوقف الصحيح", "en": "Stop where the meaning is complete. Don't stop in a place that breaks the meaning.", "ar": "قف حيث يتمّ المعنى، ولا تقف في موضع يُفسده."}, {"big": "مـ  ·  لا  ·  ج", "ar_big": true, "ten": "Stop signs (1)", "tar": "علامات الوقف ١", "en": "م = must stop · لا = don't stop here · ج = stop or join, both fine", "ar": "م = وقف لازم · لا = لا تقف · ج = يجوز الوقف والوصل"}, {"big": "صلى  ·  قلى  ·  ∴ ∴", "ar_big": true, "ten": "Stop signs (2)", "tar": "علامات الوقف ٢", "en": "صلى = joining is better · قلى = stopping is better · ∴ ∴ = stop at one of the two, not both", "ar": "صلى = الوصل أولى · قلى = الوقف أولى · ∴ ∴ = قف على إحداهما لا كلتيهما"}, {"big": "↩️", "ar_big": false, "ten": "Starting again", "tar": "الابتداء", "en": "After a stop, start again from a place that makes sense, even if you go back a little.", "ar": "بعد الوقف ابدأ من موضع يصحّ به المعنى، ولو رجعت قليلًا."}, {"big": "عِوَجَا ۜ قَيِّمًا", "ar_big": true, "ten": "Saktah (pause, no breath)", "tar": "السكتة", "en": "A short pause of 2 counts without taking a breath. Hafs has 4 places. Look for the small س ( ۜ ).", "ar": "سكتة قصيرة بقدر حركتين بلا تنفّس. لحفص ٤ مواضع، وعلامتها سين صغيرة ( ۜ ).", "ref": "18:1"}, {"big": "مَّرْقَدِنَا ۜ  ·  مَنْ ۜ رَاقٍ  ·  بَلْ ۜ رَانَ", "ar_big": true, "ten": "The other 3 saktāt", "tar": "السكتات الثلاث الأخرى", "en": "Yā-Sīn 36:52 · Al-Qiyāmah 75:27 · Al-Muṭaffifīn 83:14", "ar": "يس ٥٢ · القيامة ٢٧ · المطففين ١٤"}], "quiz": [{"qen": "The small sign م above the line means…", "qar": "العلامة الصغيرة م فوق السطر تعني…", "opts": [["you must stop", "وقف لازم"], ["don't stop", "لا تقف"], ["stop or join", "يجوز الأمران"]], "wen": "م is the must-stop sign.", "war": "م علامة الوقف اللازم."}, {"qen": "A saktah is…", "qar": "السكتة هي…", "opts": [["a short pause without breath", "وقفة قصيرة بلا تنفّس"], ["a long stop with a breath", "وقف طويل مع تنفّس"], ["a stretch of 6 counts", "مدّ ست حركات"]], "wen": "No breath, about 2 counts.", "war": "بلا تنفّس، بقدر حركتين."}, {"qen": "How many saktāt does Hafs have?", "qar": "كم سكتة لحفص؟", "opts": [["4", "٤"], ["2", "٢"], ["7", "٧"]], "wen": "Al-Kahf, Yā-Sīn, Al-Qiyāmah, Al-Muṭaffifīn.", "war": "الكهف ويس والقيامة والمطففين."}, {"qen": "∴ ∴ means…", "qar": "∴ ∴ تعني…", "opts": [["stop at one, not both", "قف على إحداهما فقط"], ["stop at both", "قف على كليهما"], ["never stop", "لا تقف أبدًا"]], "wen": "These are paired signs.", "war": "علامتا تعانق."}]}, "special": {"en": "Special Hafs words", "ar": "كلمات خاصة في رواية حفص", "color": "#8b3a62", "steps": [{"big": "مَجْر۪ىٰهَا", "ar_big": true, "ten": "Imālah (lean)", "tar": "الإمالة", "en": "Say رَا leaning towards “re”, like “majrēhā”. The only one in Hafs.", "ar": "تُمال الراء والألف نحو الكسر: «مَجْرِيهَا» بين بين. الموضع الوحيد لحفص.", "ref": "11:41"}, {"big": "ءَا۬عْجَمِىٌّ", "ar_big": true, "ten": "Tas-hīl (soft hamzah)", "tar": "التسهيل", "en": "Say the 2nd hamzah softly, between a hamzah and an alif.", "ar": "تُسهَّل الهمزة الثانية بين الهمزة والألف.", "ref": "41:44"}, {"big": "لَا تَأْمَ۫نَّا", "ar_big": true, "ten": "Ishmām (round your lips)", "tar": "الإشمام", "en": "While merging the ن, round your lips a little, like saying “u” silently.", "ar": "عند إدغام النون تضمّ شفتيك قليلًا كأنك تشير إلى الضمة.", "ref": "12:11"}, {"big": "وَيَبْصُۜطُ", "ar_big": true, "ten": "Written ص, read س", "tar": "تُكتب صادًا وتُقرأ سينًا", "en": "Read it with س: “yabsuṭ”. A small س on top reminds you.", "ar": "تُقرأ بالسين: «يَبْسُطُ». والسين الصغيرة فوقها تذكّرك.", "ref": "2:245"}, {"big": "ضَعْفٍ · ضُعْفٍ", "ar_big": true, "ten": "Two ways", "tar": "وجهان", "en": "In Ar-Rūm 30:54, ضَعْف can be read with fatḥah or ḍammah on ض.", "ar": "في سورة الروم ٥٤ يجوز فتح الضاد وضمّها في «ضعف».", "ref": "30:54"}], "quiz": [{"qen": "Which word has imālah in Hafs?", "qar": "أي كلمة فيها إمالة عند حفص؟", "opts": [["مَجْر۪ىٰهَا", "مَجْر۪ىٰهَا"], ["ٱلْحَمْدُ", "ٱلْحَمْدُ"], ["قُلْ", "قُلْ"]], "wen": "Hūd 11:41, the only one.", "war": "هود ٤١، الموضع الوحيد."}, {"qen": "وَيَبْصُۜطُ (Al-Baqarah 2:245) is read with…", "qar": "«وَيَبْصُۜطُ» تُقرأ بـ…", "opts": [["س", "السين"], ["ص", "الصاد"]], "wen": "The small س tells you.", "war": "السين الصغيرة تدلّك."}, {"qen": "In ءَا۬عْجَمِىٌّ, the 2nd hamzah is…", "qar": "في «ءَا۬عْجَمِىٌّ» الهمزة الثانية…", "opts": [["said softly (tas-hīl)", "مسهّلة"], ["dropped", "محذوفة"], ["stretched 6", "تُمدّ ستًّا"]], "wen": "Soft, between hamzah and alif.", "war": "بين الهمزة والألف."}, {"qen": "In لَا تَأْمَ۫نَّا you…", "qar": "في «لَا تَأْمَ۫نَّا»…", "opts": [["round your lips while merging", "تضمّ شفتيك مع الإدغام"], ["say two clear ن", "تُظهر النونين"]], "wen": "That's ishmām.", "war": "هذا الإشمام."}]}, "letters": {"en": "Meet the letters", "ar": "تعرّف على الحروف", "color": "#c08a2e", "steps": [{"big": "ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي", "ar_big": true, "ten": "28 letters", "tar": "٢٨ حرفًا", "en": "Arabic has 28 letters. You read from right to left ←", "ar": "العربية ٢٨ حرفًا، وتُقرأ من اليمين إلى اليسار ←"}, {"big": "ب  ت  ث", "ar_big": true, "ten": "Same shape, different dots", "tar": "شكل واحد ونقاط مختلفة", "en": "1 dot below = b · 2 dots above = t · 3 dots above = th", "ar": "نقطة تحت = ب · نقطتان فوق = ت · ثلاث فوق = ث"}, {"big": "ج  ح  خ", "ar_big": true, "ten": "Another family", "tar": "عائلة أخرى", "en": "Dot inside = j · no dot = ḥ · dot on top = kh", "ar": "نقطة في الوسط = ج · بلا نقطة = ح · نقطة فوق = خ"}, {"big": "د ذ · ر ز · س ش", "ar_big": true, "ten": "Pairs", "tar": "أزواج", "en": "The one with dots is a different letter: d/dh · r/z · s/sh", "ar": "الحرف المنقوط حرف آخر: د/ذ · ر/ز · س/ش"}, {"big": "ص ض · ط ظ · ع غ", "ar_big": true, "ten": "More pairs", "tar": "أزواج أخرى", "en": "Same idea: ṣ/ḍ · ṭ/ẓ · ‘ayn/ghayn", "ar": "الفكرة نفسها: ص/ض · ط/ظ · ع/غ"}, {"big": "بـ  ـبـ  ـب", "ar_big": true, "ten": "Letters hold hands", "tar": "الحروف تتصل", "en": "Letters change shape a little when they join: start, middle, end.", "ar": "يتغيّر شكل الحرف قليلًا عند الاتصال: أول الكلمة ووسطها وآخرها."}], "quiz": [{"qen": "Which letter has 1 dot below?", "qar": "أي حرف تحته نقطة واحدة؟", "opts": [["ب", "ب"], ["ت", "ت"], ["ث", "ث"]], "wen": "ب = b, one dot below.", "war": "الباء نقطة تحتها."}, {"qen": "Arabic is read…", "qar": "العربية تُقرأ…", "opts": [["right to left", "من اليمين إلى اليسار"], ["left to right", "من اليسار إلى اليمين"]], "wen": "Start on the right side ←", "war": "ابدأ من اليمين ←"}, {"qen": "Which letter has a dot on top?", "qar": "أي حرف فوقه نقطة؟", "opts": [["خ", "خ"], ["ح", "ح"], ["ج", "ج"]], "wen": "خ = kh.", "war": "الخاء نقطتها فوق."}, {"qen": "How many letters are there?", "qar": "كم عدد الحروف؟", "opts": [["28", "٢٨"], ["20", "٢٠"], ["35", "٣٥"]], "wen": "28 letters.", "war": "٢٨ حرفًا."}]}, "exam": {"en": "Mastery exam", "ar": "اختبار الإتقان", "color": "#0f5c4d", "steps": [{"big": "🏆", "ar_big": false, "ten": "Final exam", "tar": "الاختبار النهائي", "en": "12 questions from everything you learned. Take your time. You can redo it any day.", "ar": "١٢ سؤالًا من كل ما تعلّمته. خذ وقتك، ويمكنك إعادته متى شئت."}], "quiz": []}};
const KID={"izhar": ["Throat letters live far back in your throat. ن lives at the front. They are too far apart to mix. So ن just says its sound clearly.", "حروف الحلق في آخر الحلق، والنون في مقدمة الفم. هما بعيدتان فلا تختلطان، فتنطق النون واضحة."], "idghamG": ["ن is shy. When it meets ي ن م و, it hides inside them. But it leaves its hum, so you still hear “nnn”.", "النون خجولة؛ إذا قابلت ي ن م و دخلت فيها، لكنها تترك غنتها فتسمع «ننن»."], "idghamN": ["ل and ر are strong. ن jumps into them and disappears. No hum.", "اللام والراء قويتان؛ تقفز النون فيهما وتختفي بلا غنة."], "iqlab": ["ن and ب don't sound nice together. So ن dresses up as م before ب.", "النون والباء لا تنسجمان، فتلبس النون ثوب الميم قبل الباء."], "ikhfa": ["ن hides behind the next letter, like a kid peeking from behind a door. Half there. You hear a hum.", "النون تختبئ خلف الحرف التالي، كطفل يطلّ من خلف الباب: نصف ظاهرة، مع غنة."], "ikhfaS": ["م uses your lips. ب uses your lips too. So keep the lips soft and hum.", "الميم تحتاج الشفتين، والباء كذلك؛ فاجعل الشفتين خفيفتين وغُنّ."], "idghamS": ["Two م's meet, like two hands making one clap. Say one long م with a hum.", "ميمان تلتقيان كيدين تصفقان صفقة واحدة، فتنطق ميمًا واحدة مع غنة."], "izharS": ["م meets any other letter. Just say “m” clearly and keep going.", "الميم تقابل حرفًا آخر، فانطقها واضحة وتابع."], "ghunnah": ["See نّ or مّ? Hum like humming a song: “nnn” or “mmm”, for 2 taps.", "ترى نّ أو مّ؟ دندن من أنفك «ننن» أو «ممم» بقدر نقرتين."], "qalS": ["ق ط ب ج د are bouncy balls. With a sukūn, let them bounce a little.", "ق ط ب ج د كرات مطاطية؛ إذا سكنت فاجعلها تقفز قليلًا."], "qalK": ["When you stop at the end, the bouncy ball bounces higher. Make it clear.", "عند الوقف في الآخر تقفز الكرة أعلى، فاجعلها واضحة."], "lamQ": ["The moon doesn't hide the stars. With moon letters, you hear the ل.", "القمر لا يخفي النجوم؛ فمع الحروف القمرية تسمع اللام."], "lamS": ["The sun is so bright you can't see stars. With sun letters, the ل disappears.", "الشمس قوية تخفي النجوم؛ فمع الحروف الشمسية تختفي اللام."], "jalH": ["After an “a” or “u” sound, say Allah with a big round mouth. Deep and full.", "بعد الفتحة أو الضمة، قل «الله» بفم كبير مستدير."], "jalL": ["After an “i” sound, your mouth is smiling. Say Allah thin and soft.", "بعد الكسرة يكون فمك كأنه يبتسم، فقل «الله» برقة."], "tabii": ["A normal long sound, like “baa”. 2 taps. That's all.", "مد عادي مثل «بَا»: نقرتان فقط."], "muttasil": ["Long vowel and ء are in the same word, holding hands. Stretch longer: 4 or 5 taps.", "حرف المد والهمزة في كلمة واحدة يمسكان بأيدي بعض، فمُدّ ٤ أو ٥ نقرات."], "munfasil": ["Long vowel ends one word. ء starts the next word. Neighbours. Stretch 4 or 5 taps.", "حرف المد في آخر كلمة والهمزة في أول التالية، كجارين. مُدّ ٤ أو ٥ نقرات."], "lazim": ["Long vowel runs into a shaddah, like a big wall. Always stretch the most: 6 taps.", "حرف المد يصطدم بشدة كجدار كبير، فتمدّ دائمًا ٦ نقرات."], "arid": ["You stop at the end of the verse to breathe. That makes the long vowel stretchy: 2, 4 or 6 taps.", "تقف في آخر الآية لتتنفس، فيصير المد مرنًا: ٢ أو ٤ أو ٦ نقرات."], "leen": ["Like “ay” in “day” or “ow” in “now”. When you stop after it, you may stretch it softly.", "مثل «أَيْ» و«أَوْ». إذا وقفت بعدها جاز أن تمدّها بلين."]};

const QS = [];
/* Auto-detect other common rules inside a highlight so quiz options are never ambiguous */
function detect(h){
  const a=[];
  if(/\u0670|\u064E[\u0627\u0649]|\u064F\u0648(?![\u064B-\u0652])|\u0650[\u064A\u0649](?![\u064B-\u0652])/.test(h)) a.push("tabii");
  if(/[\u0646\u0645][\u064B-\u0650]?\u0651/.test(h)) a.push("ghunnah");
  if(/\u0671\u0644\u0652/.test(h)) a.push("lamQ");
  if(/\u0671\u0644[^\u0652\s]/.test(h)) a.push("lamS");
  if(/[\u0642\u0637\u0628\u062C\u062F]\u0652/.test(h)) a.push("qalS");
  if(/\u0645\u0652\s*[^\u0645\u0628\s]/.test(h)) a.push("izharS");
  return a;
}

  if(mode==="review"){ if(ok){ mistakes[q.id]=(mistakes[q.id]||1)-1; if(mistakes[q.id]<=0) delete mistakes[q.id]; } else mistakes[q.id]=2; }
  else if(!ok) mistakes[q.id]=2;
  saveMist();
}

const t=(k,vars)=>{let s=(T[lang][k]??k);if(Array.isArray(s))s=s[Math.random()*s.length|0];if(vars)for(const v in vars)s=s.replace("{"+v+"}",vars[v]);return s};
const num=n=>lang==="ar"?String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rname=r=>lang==="ar"?r.ar:r.tr;
const rsub=r=>lang==="ar"?r.tr:r.en;
function ayahHTML(key,hl,color){
  const txt=V[key]; const i=txt.indexOf(hl);
  const body = i<0? esc(txt) : esc(txt.slice(0,i))+"<mark>"+esc(hl)+"</mark>"+esc(txt.slice(i+hl.length));
  return `<div class="ayah" data-key="${key}" data-hl="${esc(hl)}" style="--c:${color}">${body} <span style="font-size:.7em;color:var(--muted)">﴿${num(key.split(":")[1])}﴾</span></div>`;
}

const audioURL=key=>{const [s,a]=key.split(":");return `https://everyayah.com/data/Ibrahim_Akhdar_32kbps/${String(s).padStart(3,"0")}${String(a).padStart(3,"0")}.mp3`};
function refHTML(key){
  const [s,a]=key.split(":");
  const name=SURAH[s][lang==="ar"?0:1];
  return `<div class="ref"><span>${esc(name)} · ${num(s)}:${num(a)}</span><button class="term" data-v="${key}" style="border:none;color:var(--brand)">📖 ${t("tap_meaning")}</button><a href="${audioURL(key)}" target="_blank" rel="noopener">🔊 ${t("listen")}</a></div>`;
}
function makeFind(q,allowed){
  const pool=shuffle(QS.filter(o=>(!allowed||allowed.has(o.rule))&&o.rule!==q.rule&&!o.also.includes(q.rule)&&!q.also.includes(o.rule)&&o.hl!==q.hl));
  const seen=new Set([q.hl]),out=[];
  for(const o of pool){if(out.length===3)break;if(seen.has(o.hl))continue;seen.add(o.hl);out.push(o.id)}
  return shuffle([q.id,...out]);
}
function build(q,allowed=null,allowFind=true){
  let type=allowFind&&!NOFIND.has(q.rule)&&Math.random()<.4?"find":"rule";
  let opts=type==="find"?makeFind(q,allowed):makeOptions(q,allowed);
  if(type==="find"&&opts.length<3){type="rule";opts=makeOptions(q,allowed)}
  return {q,type,opts,hint:false};
}
const isRight=(B,p)=>B.type==="find"?p===B.q.id:p===B.q.rule;
function makeOptions(q,allowed){
  const ok=r=>!allowed||allowed.has(r.id);
  const excl=new Set([q.rule,...q.also]);
  const same=shuffle(RULES.filter(r=>ok(r)&&r.cat===q.cat&&!excl.has(r.id))).slice(0,2);
  same.forEach(r=>excl.add(r.id));
  const others=shuffle(RULES.filter(r=>ok(r)&&!excl.has(r.id))).slice(0,3-same.length);
  return shuffle([q.rule,...same.map(r=>r.id),...others.map(r=>r.id)]);
}

function questionBlock(B,{showFeedback,picked,topHTML=""}){
  const q=B.q,c=CMAP[q.cat],done=showFeedback&&picked!=null;
  const head = B.type==="find"
    ? `<div class="qtext">${t("q_find")}</div><div class="qrule" style="--c:${c.color}">${esc(rname(RMAP[q.rule]))} · ${esc(rsub(RMAP[q.rule]))}</div><div style="height:14px"></div>`
    : `${ayahHTML(q.key,q.hl,c.color)}${refHTML(q.key)}<div class="qtext">${t("q_which")}</div>`;
  const opts=B.opts.map(id=>{
    let cls="";const right=B.type==="find"?id===q.id:id===q.rule;
    if(done){ if(right)cls="right"; else if(id===picked)cls="wrong"; } else if(id===picked) cls="picked";
    let inner;
    if(B.type==="find"){const o=QS.find(x=>x.id===id);inner=`<span>${esc(o.hl)}</span><small>${done?esc(rname(RMAP[o.rule])):""}</small>`}
    else {const r=RMAP[id];inner=`<span>${esc(rname(r))}</span><small>${esc(rsub(r))}</small>`}
    return `<button class="opt ${B.type==="find"?"phrase":""} ${cls}" data-opt="${id}" ${done?"disabled":""}>${inner}</button>`}).join("");
  const hintBox = !done ? (B.hint
     ? `<div class="fb" style="background:var(--gold-soft);margin:0 0 14px;white-space:pre-line"><b>💡 ${t("hint_title")}</b>${gl(HINT[q.cat][lang])}${B.type==="find"?`<div style="margin-top:6px">🔎 ${gl(EASY[q.rule][lang==="ar"?3:1])}</div>`:""}</div>`
     : `<div style="margin:-4px 0 12px"><button class="chip" data-hint="1">💡 ${t("hint")}</button></div>`) : "";
  return `<div class="card qbox">${topHTML}${head}${hintBox}<div class="opts">${opts}</div>
    ${done?feedback(B,isRight(B,picked)):""}</div>`;
}
function bindHint(B,rerender){const h=app.querySelector('[data-hint]');if(h)h.onclick=()=>{B.hint=true;rerender()}}

  const q=B.q,r=RMAP[q.rule],c=CMAP[q.cat];

}

const MARKRE=/[ً-ٰٟۖ-ۭـ]/;
function clusters(w){const out=[];for(const ch of w){if(MARKRE.test(ch)&&out.length)out[out.length-1]+=ch;else out.push(ch)}return out}
function bigWord(r,mode,state={}){
  const v=VIS[r.id],e=r.ex[v.t[0]],cls=clusters(e[1]);
  return `<div class="bigword ${mode==="tap"?"tap":""}" style="--c:${CMAP[r.cat].color}">${cls.map((c,i)=>{
    if(c===" ")return " ";
    let k="cl";
    if(mode==="see"){if(i===v.t[1])k+=" tg";if(i===v.t[2])k+=" src"}
    else{if(state.hintSrc&&i===v.t[2])k+=" src";if(state.good&&i===v.t[1])k+=" good";if(state.bad===i)k+=" bad"}
    return `<span class="${k}" data-ci="${i}">${esc(c)}</span>`}).join("")}</div>`;
}

function startLesson(id){
  let steps;
  if(id==="found") steps=FOUND.map(f=>({kind:"found",f}));
  else if(CONCEPT[id]) steps=CONCEPT[id].steps.map(x=>({kind:"concept",x}));
  else steps=[{kind:"intro"},...RULES.filter(r=>r.cat===id).flatMap(r=>[{kind:"see",r},{kind:"tap",r,st:{}}])];
  let quiz;
  if(id==="exam"){const rq=shuffle(QS).slice(0,6).map(q=>({kind:"q",B:build(q,null,false),picked:null}));const cq=shuffle(Object.keys(CONCEPT).filter(k=>k!=="exam").flatMap(k=>CONCEPT[k].quiz)).slice(0,6).map(x=>({kind:"cq",x,order:shuffle(x.opts.map((_,i)=>i)),picked:null}));quiz=shuffle(rq.concat(cq))}
  else if(CONCEPT[id]) quiz=shuffle(CONCEPT[id].quiz).slice(0,4).map(x=>({kind:"cq",x,order:shuffle(x.opts.map((_,i)=>i)),picked:null}));
  else if(id==="found") quiz=shuffle(MARKS).slice(0,4).map(m=>({kind:"mark",m,opts:shuffle([m.k,...shuffle(Object.keys(MARKN).filter(k=>k!==m.k)).slice(0,3)]),picked:null}));
  else{
    const allowed=new Set([...learnedRules(),...RULES.filter(r=>r.cat===id).map(r=>r.id)]);
    const rs=RULES.filter(r=>r.cat===id);
    let qs=[];rs.forEach(r=>{qs.push(shuffle(QS.filter(q=>q.rule===r.id))[0])});
    qs=shuffle(qs.concat(shuffle(QS.filter(q=>q.cat===id&&!qs.includes(q))).slice(0,Math.max(0,6-qs.length)))).slice(0,4);
    quiz=qs.map(q=>({kind:"q",B:build(q,allowed,false),picked:null}));
  }
  const withBreaks=[];steps.forEach((x,i)=>{withBreaks.push(x);if((i+1)%4===0&&i<steps.length-1)withBreaks.push({kind:"break"})});
  LS={id,steps:withBreaks,step:0,quiz,qi:-1,score:0};
  lessonRun();
}
function lessonRun(){
  store.set("resume",LS.qi===-2?null:{id:LS.id,step:LS.step});
  const id=LS.id,c=lColor(id),total=LS.steps.length+LS.quiz.length;
  const pos=LS.qi<0?LS.step:LS.steps.length+LS.qi;
  const top=`<div class="note"><a href="#lessons" id="lback" style="text-decoration:none">← ${t("all_lessons")}</a> · ${t("lesson")} ${num(LESSONS.indexOf(id)+1)}</div>
    <h1 style="margin-top:6px">${esc(lTitle(id))}</h1><p class="tip">${t("tip")}</p><div class="progress"><i style="width:${LS.qi===-2?100:Math.min(100,pos/total*100)}%;background:${c}"></i></div>`;
  let body="",nav="";
  if(LS.qi===-2){ // finished
    const n=LS.quiz.length;
    body=`<div class="card empty"><div class="big">🌟</div><h2>${t("lesson_done")}</h2><p style="font-size:18px">${t("done_msg")}</p><p style="font-size:20px"><b>⭐ +${num(LS.score*10+50)}</b></p></div>`;
    const ni=LESSONS.indexOf(id)+1;
    nav=`<div class="row"><button class="btn ghost" id="lredo">${t("redo")}</button>${ni<LESSONS.length?`<button class="btn" id="lnext">${t("next_lesson")}</button>`:`<a class="btn" href="#practice" style="text-decoration:none">${t("nav_practice")}</a>`}</div>`;
  } else if(LS.qi<0){
    const st=LS.steps[LS.step];
    if(st.kind==="found") body=`<article class="card found" style="padding:28px"><div class="demo" style="font-size:52px">${st.f.demo}</div><h2>${esc(st.f[lang])}</h2><p style="font-size:17px;margin:0">${gl(lang==="ar"?st.f.dar:st.f.den)}</p></article>`;
    else if(st.kind==="intro"){const rs=RULES.filter(r=>r.cat===id);
      body=`<article class="card pad rule" style="--c:${c}"><p style="font-size:22px;font-weight:600;margin:0">${gl(INTRO[id][lang])}</p><div class="note" style="margin-top:12px">${t("in_lesson")}:</div><div class="chips" style="margin:8px 0 0">${rs.map(r=>`<span class="chip">${esc(rname(r))}</span>`).join("")}</div></article>`;}
    else if(st.kind==="break"){
      body=`<div class="card empty"><div class="big">🌿</div><h2>${t("brk_t")}</h2><p style="font-size:18px;max-width:420px;margin:8px auto">${t("brk_l")}</p></div>`;}
    else if(st.kind==="concept"){const x=st.x;
      body=`<article class="card pad center" style="--c:${c}"><div class="${x.ar_big?"bigword":""}" style="${x.ar_big?"font-size:clamp(40px,10vw,64px);color:var(--c)":"font-size:56px;margin:10px 0"}" dir="rtl">${esc(x.big)}</div>
        <h2 style="color:var(--c)">${esc(lang==="ar"?x.tar:x.ten)}</h2><p style="font-size:19px;font-weight:500;margin:6px auto 4px;max-width:520px">${gl(lang==="ar"?x.ar:x.en)}</p>${x.ref?`<div style="display:flex;justify-content:center;margin-top:8px">${refHTML(x.ref)}</div>`:""}</article>`;}
    else if(st.kind==="see"){const r=st.r,e=r.ex[VIS[r.id].t[0]];
      body=`<article class="card pad" style="--c:${CMAP[id].color}"><div class="rulelabel">${esc(rname(r))}</div>${bigWord(r,"see")}${formulaHTML(r)}
      <div class="row" style="justify-content:center;margin-top:0"><button class="chip" data-kid="${r.id}">🧸 ${t("eli5")}</button><button class="chip" data-v="${e[0]}">📖 ${t("tap_meaning")}</button><a class="chip" style="text-decoration:none;color:inherit" href="${audioURL(e[0])}" target="_blank" rel="noopener">🔊 ${t("listen")}</a></div></article>`;}
    else if(st.kind==="tap"){const r=st.r;
      body=`<article class="card pad" style="--c:${CMAP[id].color}"><div class="rulelabel">${esc(rname(r))}</div><div class="prompt">👆 ${gl(tapQ(r))}</div>${bigWord(r,"tap",st.st)}
      <div class="win" style="${st.st.good?"":"color:var(--bad)"}">${st.st.msg||""}</div>${st.st.good?formulaHTML(r):""}</article>`;}
    const last=LS.step===LS.steps.length-1;
    const locked=st.kind==="tap"&&!st.st.good;
    nav=st.kind==="break"?`<div class="row" style="justify-content:center"><a class="btn ghost" href="#home" id="lstop" style="text-decoration:none">${t("brk_stop")}</a><button class="btn" id="lnx">${t("brk_go")}</button></div>`:`<div class="row">${LS.step>0?`<button class="btn ghost" id="lprev">${t("back")}</button>`:""}${locked?"":`<button class="btn" id="lnx">${last?t("to_quiz"):(st.kind==="see"?t("got_it")+(lang==="ar"?" ←":" →"):t("continue_"))}</button>`}</div>`;
  } else {
    const item=LS.quiz[LS.qi],head=`<div class="qtop"><span>${t("quiz")} · ${num(LS.qi+1)}/${num(LS.quiz.length)}</span></div>`;
    if(item.kind==="cq"){const x=item.x,done=item.picked!=null,A=lang==="ar"?1:0;
      body=`<div class="card qbox">${head}<div class="qtext" style="font-size:20px">${gl(lang==="ar"?x.qar:x.qen)}</div>
      <div class="opts">${item.order.map(i=>{let cls="";if(done){if(i===0)cls="right";else if(i===item.picked)cls="wrong"}
        return `<button class="opt ${cls}" data-cq="${i}" ${done?"disabled":""}><span>${bidi(esc(x.opts[i][A]))}</span></button>`}).join("")}</div>
      ${done?`<div class="fb ${item.picked===0?"ok":"no"}"><b>${item.picked===0?"✨ "+t("nice")+" +10 ⭐":t("incorrect")+" "+t("answer_is")+": "+bidi(esc(x.opts[0][A]))}</b>${gl(lang==="ar"?x.war:x.wen)}</div>`:""}</div>`;
    } else if(item.kind==="mark"){
      const done=item.picked!=null;
      body=`<div class="card qbox">${head}<div class="qtext">${t("q_mark")}</div><div class="ayah" style="text-align:center;font-size:64px;line-height:1.6;color:var(--gold)">${item.m.d}</div>
      <div class="opts">${item.opts.map(k=>{let cls="";if(done){if(k===item.m.k)cls="right";else if(k===item.picked)cls="wrong"}
        return `<button class="opt ${cls}" data-mk="${k}" ${done?"disabled":""}><span>${MARKN[k][lang==="ar"?0:1]}</span><small>${MARKN[k][lang==="ar"?1:0]}</small></button>`}).join("")}</div>
      ${done?`<div class="fb ${item.picked===item.m.k?"ok":"no"}"><b>${item.picked===item.m.k?t("correct"):t("incorrect")+" "+t("answer_is")+": "+MARKN[item.m.k][lang==="ar"?0:1]}</b></div>`:""}</div>`;
    } else body=questionBlock(item.B,{showFeedback:true,picked:item.picked,topHTML:head});
    nav=item.picked!=null?`<div class="row"><button class="btn" id="lnx">${t("next")}</button></div>`:"";
  }
  app.innerHTML=top+body+nav;
  const g=x=>document.getElementById(x);
  if(g("lback"))g("lback").onclick=()=>{LS=null};
  if(g("lstop"))g("lstop").onclick=()=>{LS.step++;store.set("resume",{id:LS.id,step:LS.step});LS=null};
  if(g("lprev"))g("lprev").onclick=()=>{LS.step--;lessonRun();scrollTo(0,0)};
  if(g("lredo"))g("lredo").onclick=()=>startLesson(id);
  if(g("lnext"))g("lnext").onclick=()=>startLesson(LESSONS[LESSONS.indexOf(id)+1]);
  if(g("lnx"))g("lnx").onclick=()=>{
    if(LS.qi<0){ if(LS.step<LS.steps.length-1)LS.step++; else LS.qi=0; }
    else { if(LS.qi<LS.quiz.length-1)LS.qi++; else { LS.qi=-2; if(!doneL.includes(id)){doneL.push(id);saveDone()} P.q=null; addStars(50); setTimeout(confetti,50); } }
    lessonRun();scrollTo(0,0);
  };
  if(LS.qi<0&&LS.steps[LS.step].kind==="tap"){const st=LS.steps[LS.step],v=VIS[st.r.id];
    app.querySelectorAll(".bigword.tap .cl").forEach(sp=>sp.onclick=()=>{if(st.st.good)return;const i=+sp.dataset.ci;
      if(i===v.t[1]){st.st={good:true,msg:"✨ "+t("nice")+" +10 ⭐"};addStars(10)}
      else{st.st.tries=(st.st.tries||0)+1;st.st.bad=i;st.st.hintSrc=v.t[2]!=null;st.st.msg=v.t[2]!=null?t("tryagain"):t("tryagain2");if(st.st.tries>=3){st.st.good=true;st.st.msg="👉 "+t("got_it")}}
      lessonRun()});}
  app.querySelectorAll("[data-cq]").forEach(b=>b.onclick=()=>{const it=LS.quiz[LS.qi];if(it.picked!=null)return;it.picked=+b.dataset.cq;if(it.picked===0){LS.score++;addStars(10)}lessonRun()});
  app.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{const it=LS.quiz[LS.qi];if(it.picked!=null)return;it.picked=b.dataset.mk;if(it.picked===it.m.k){LS.score++;addStars(10)}lessonRun()});
  if(LS.qi>=0){const it=LS.quiz[LS.qi];if(it.kind==="q"){
    bindHint(it.B,lessonRun);
    app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{if(it.picked!=null)return;it.picked=b.dataset.opt;const ok=isRight(it.B,it.picked);if(ok)LS.score++;record(it.B.q,ok,"lesson");lessonRun()});
  }}
}

let R={q:null,B:null,picked:null};
function review(){
  const ids=Object.keys(mistakes).filter(id=>QS.some(q=>q.id===id));
  let head=`<h1>${t("review_title")}</h1><p class="lead">${t("review_lead")}</p>`;
  if(!ids.length && !R.q){
    app.innerHTML=head+`<div class="card empty"><div class="big">${stats.answered?"🌿":"📭"}</div><p>${stats.answered?t("review_done"):t("review_empty")}</p><a class="btn" href="#practice" style="text-decoration:none;display:inline-block;margin-top:8px">${t("go_practice")}</a></div>`;
    return;
  }
  if(!R.q){const id=ids[Math.random()*ids.length|0];R.q=QS.find(q=>q.id===id);R.B=build(R.q,learnedRules().size?new Set([...learnedRules(),R.q.rule]):null);R.picked=null}
  const need=mistakes[R.q.id];
  app.innerHTML=head+questionBlock(R.B,{showFeedback:true,picked:R.picked,topHTML:`<div class="qtop"><span>${t("review_left",{n:num(ids.length)})}</span><span>${need?t("remaining",{n:num(need)}):"✓"}</span></div>`})+
   `<div class="row"><button class="btn ghost" id="clr">${t("review_clear")}</button>${R.picked!=null?`<button class="btn" id="nx">${t("next")}</button>`:""}</div>`;
  bindHint(R.B,review);
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{if(R.picked!=null)return;R.picked=b.dataset.opt;record(R.q,isRight(R.B,R.picked),"review");review()});
  document.getElementById("clr").onclick=()=>{mistakes={};saveMist();R.q=null;review()};
  const nx=document.getElementById("nx"); if(nx){nx.onclick=()=>{R.q=null;review()};nx.focus()}
}

/* ---------- Tap-to-explain popup ---------- */
const pop=document.getElementById("pop"),popc=document.getElementById("popc");
function openPop(html){popc.innerHTML=`<button class="x" aria-label="${t("close")}" id="px">×</button>`+html;pop.classList.add("on");document.getElementById("px").onclick=closePop;document.getElementById("px").focus()}
function closePop(){pop.classList.remove("on")}
pop.addEventListener("click",e=>{if(e.target===pop)closePop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-g]");
  if(g){e.preventDefault();e.stopPropagation();const x=GLOSS.find(z=>z.id===g.dataset.g);
    openPop(`<h3>${esc(lang==="ar"?x.ar:x.en)}</h3><div class="simple">${bidi(esc(lang==="ar"?x.sar:x.sen))}</div>`);return}
  const k=e.target.closest("[data-kid]");
  if(k){const r=RMAP[k.dataset.kid];openPop(`<h3>🧸 ${esc(rname(r))}</h3><div class="simple">${gl(KID[r.id][lang==="ar"?1:0])}</div>`);return}
  const mx=e.target.closest("[data-moreex]");
  if(mx){const r=RMAP[mx.dataset.moreex],c=CMAP[r.cat];openPop(`<h3>${esc(rname(r))}</h3>`+r.ex.slice(1).map(e=>`<div class="ex">${ayahHTML(e[0],e[1],c.color)}${refHTML(e[0])}<div class="note">${gl(lang==="ar"?e[3]:e[2])}</div></div>`).join(""));return}
  const v=e.target.closest("[data-v],.ayah[data-key]");
  if(v&&!e.target.closest(".opt")){const key=v.dataset.v||v.dataset.key;const [s,a]=key.split(":");
    const hl=v.dataset.hl||"";
    openPop(`<h3>${t("meaning")} · ${esc(SURAH[s][lang==="ar"?0:1])} ${num(s)}:${num(a)}</h3>${ayahHTML(key,hl,"var(--gold)").replace('data-key','data-x')}
      <div class="simple" dir="ltr" style="text-align:left;margin-top:8px">${esc(TRANS[key]||"")}</div><div class="note" style="margin-top:10px">${t("meaning_src")}</div>`);}
},true);

/* ---------- Shell ---------- */
function applyLang(){
  const h=document.documentElement; h.lang=lang; h.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.getElementById("langBtn").textContent=t("switch");
  document.title=lang==="ar"?"إتقان":"Itqaan";
}
function route(){closePop();
  const h=(location.hash||"#home").slice(1); current=views[h]?h:"home";
  if(current!=="test") clearInterval(timer);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+current));
  views[current](); window.scrollTo(0,0);
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";store.set("lang",lang);applyLang();renderPill();views[current]()};
window.addEventListener("hashchange",route);
applyLang(); renderPill(); route();
</script>
